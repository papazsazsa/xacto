<script type="module">
// ==== 00_core.js ====
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// XACTO core: math helpers, RNG, shared uniforms, world constants
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
// flight steering: 'stick' (push the round) or 'point' (move an aim marker; the round flies to it)
const STEER_MODE = QS.get('steer') || 'point';
// fire mission: a mortar reward stage every fifth stage (src/08_mortar.js). Set false to switch it off.
const FIRE_MISSION = true;
// the last stage: the helicopter on stage 30. Bring it down and you have saved the city.
const FINAL_STAGE = 30;
// phone / tablet: forced by the mobile build (window.XACTO_MOBILE) or ?touch, otherwise detected from the
// primary pointer. The HUD also switches to its touch layout on the first touch of any device.
const MOBILE = !!window.XACTO_MOBILE || QS.has('touch') || (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches);
const BASE_SEED = parseInt(QS.get('seed') || '', 10) || 0;

// City RNG is re-seeded every time a new city is generated.
let cityRand = mulberry32(1987);
const crnd = (a = 0, b = 1) => a + (b - a) * cityRand();
const reseedCity = (s) => { cityRand = mulberry32(s >>> 0); };
// Gameplay RNG
const gameRand = TEST ? mulberry32((BASE_SEED || 1987) * 31 + 7) : Math.random;
const grnd = (a = 0, b = 1) => a + (b - a) * gameRand();
const newSeed = () => (TEST ? ((BASE_SEED || 1987) + (newSeed.n = (newSeed.n || 0) + 1) * 7919) : ((Math.random() * 0x7fffffff) | 0));

function gauss(r = Math.random) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * r()); }

class OU {
  constructor(tau, sigma, r) { this.tau = tau; this.sigma = sigma; this.r = r || gameRand; this.x = 0; }
  step(dt) { const a = Math.exp(-dt / this.tau); this.x = this.x * a + this.sigma * Math.sqrt(Math.max(0, 1 - a * a)) * gauss(this.r); return this.x; }

}
const Store = {
  get(k, d) { try { const v = localStorage.getItem('xacto.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('xacto.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

// Shared uniforms (referenced by every thermal material)
const U = {
  uTime: { value: 0 },
  uCam: { value: new THREE.Vector3() },
  uFogD: { value: 0.00036 },
  uHaze: { value: 0.30 },
};

// City grid layout (metres). Main avenue runs along -Z from the player.
const GRID = { aveSp: 150, mainHW: 18, aveHW: 11, stSp: 95, stHW: 8, sw: 5, nAve: 7, nSt: 34 };
// .50 BMG-ish ballistics: quadratic drag dv/dt = -k|v|v
const PHYS = { g: 9.81, v0: 880, k: 3.0e-4 };
const PLAYER = { eye: new THREE.Vector3(0, 71.35, 14.6), roofY: 70 };
const UP = new THREE.Vector3(0, 1, 0);

// ==== 01_audio.js ====
// ---------------------------------------------------------------------------
// Sfx: fully synthesised WebAudio sound (no assets)
//   graph:  sources -> buses (report / sfx / ui / amb / flight) -> sum -> HP 24 Hz
//           -> compressor -> master -> soft clipper -> out
//   city reverb: convolver with a generated "street canyon" impulse response
//   (discrete slap-back echoes off buildings, duller with distance, plus a
//   rolling diffuse tail). Arcade sounds run on a 60 Hz "sound driver": pitch
//   and volume change in frame steps on pulse / triangle / noise voices.
// The context is created and resumed on the first key / click / touch
// (Sfx.init is called from those handlers), so browser autoplay rules hold.
// Sfx.renderOffline(name, args, seconds, events) renders any sound through the
// same graph into an OfflineAudioContext (used by the audio probe).
// ---------------------------------------------------------------------------
const Sfx = (() => {
  let ctx = null, A = null, flight = null, amb = null, sirenTimer = 0;
  let muted = Store.get('muted', false);
  const MASTER = 0.8;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = (a = 0, b = 1) => a + (b - a) * Math.random();

  // ---- graph ----------------------------------------------------------------------
  function makeGraph(c) {
    const g = { c };
    const sr = c.sampleRate;
    // noise tables (white, and brown for distant rumble)
    g.white = c.createBuffer(1, sr * 2, sr);
    { const d = g.white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    g.brown = c.createBuffer(1, sr * 4, sr);
    { const d = g.brown.getChannelData(0); let y = 0; for (let i = 0; i < d.length; i++) { y = (y + 0.02 * (Math.random() * 2 - 1)) * 0.997; d[i] = y * 3.5; } }
    // supersonic N-wave (2.2 ms) used for cracks
    { const L = Math.round(sr * 0.0022), b = c.createBuffer(1, L + 64, sr), d = b.getChannelData(0);
      for (let i = 0; i < L; i++) d[i + 4] = 1 - 2 * i / L; g.nwave = b; }
    // pulse waves (12.5 %, 25 %, 50 %) for the chip voices
    g.wave = {};
    for (const [k, duty] of [['p12', 0.125], ['p25', 0.25], ['p50', 0.5]]) {
      const N = 48, re = new Float32Array(N), im = new Float32Array(N);
      for (let n = 1; n < N; n++) { re[n] = (2 / (n * Math.PI)) * Math.sin(2 * Math.PI * n * duty); im[n] = (2 / (n * Math.PI)) * (1 - Math.cos(2 * Math.PI * n * duty)); }
      g.wave[k] = c.createPeriodicWave(re, im);
    }
    g.sum = c.createGain();
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 24; hp.Q.value = 0.6;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.22;
    g.master = c.createGain(); g.master.gain.value = muted ? 0 : MASTER;
    const clip = c.createWaveShaper(); clip.curve = softClipCurve(); clip.oversample = '2x';
    g.sum.connect(hp).connect(comp).connect(g.master).connect(clip).connect(c.destination);
    // city reverb
    g.verb = c.createConvolver(); g.verb.buffer = makeCityIR(c, 3.6);
    g.verbIn = c.createGain(); g.verbIn.gain.value = 1;
    g.verbLP = c.createBiquadFilter(); g.verbLP.type = 'lowpass'; g.verbLP.frequency.value = 9000;
    g.verbOut = c.createGain(); g.verbOut.gain.value = 0.9;
    g.verbIn.connect(g.verb).connect(g.verbLP).connect(g.verbOut).connect(g.sum);
    // buses
    g.sfx = c.createGain(); g.sfx.connect(g.sum);
    g.ui = c.createGain(); g.ui.gain.value = 0.9; g.ui.connect(g.sum);
    g.amb = c.createGain(); g.amb.gain.value = 1;
    // the whole ambience bus darkens when time slows (see slowWorld)
    g.ambLP = c.createBiquadFilter(); g.ambLP.type = 'lowpass'; g.ambLP.frequency.value = 20000; g.ambLP.Q.value = 0.6;
    g.amb.connect(g.ambLP).connect(g.sum);
    g.reportIn = c.createGain();
    g.reportLP = c.createBiquadFilter(); g.reportLP.type = 'lowpass'; g.reportLP.frequency.value = 18000; g.reportLP.Q.value = 0.5;
    g.report = c.createGain();
    g.reportIn.connect(g.reportLP).connect(g.report); g.report.connect(g.sum);
    g.reportSend = c.createGain(); g.reportSend.gain.value = 0.5; g.report.connect(g.reportSend).connect(g.verbIn);
    return g;
  }
  function softClipCurve() {
    const n = 2048, cv = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x); cv[i] = Math.sign(x) * (a < 0.7 ? a : 0.7 + 0.3 * Math.tanh((a - 0.7) / 0.3)); }
    return cv;
  }
  // Street-canyon impulse response: discrete slaps (each a short diffuse burst,
  // darker and wider the later it arrives) + a slow-building, rolling tail.
  function makeCityIR(c, sec) {
    const sr = c.sampleRate, len = Math.floor(sr * sec), b = c.createBuffer(2, len, sr);
    const slaps = [[0.083, 0.75, -0.7], [0.142, 0.55, 0.6], [0.231, 0.5, -0.2], [0.348, 0.42, 0.8], [0.47, 0.3, -0.6], [0.66, 0.26, 0.3], [0.91, 0.18, -0.4], [1.24, 0.13, 0.7], [1.71, 0.08, -0.5]];
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (const [t, amp, pan] of slaps) {
        const gainC = amp * (ch === 0 ? Math.min(1, 1 - pan) : Math.min(1, 1 + pan));
        const s0 = Math.floor((t + (ch ? 0.006 : 0) * pan) * sr), tau = (0.002 + t * 0.012) * sr;
        const fc = 7000 * Math.exp(-t / 0.55) + 600, a = 1 - Math.exp(-2 * Math.PI * fc / sr);

      }

    try {

        const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); s.connect(ctx.destination); s.start(0);
        startAmbience();
        document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); });
      }

  }
  const now = () => ctx.currentTime;

  // ---- building blocks ----------------------------------------------------------
  function noise(t0, dur, buf, rate = 1) {
    const s = ctx.createBufferSource(); s.buffer = buf || A.white; s.loop = true; s.playbackRate.value = rate;
    s.start(t0, Math.random() * (s.buffer.duration - 0.1)); if (dur) s.stop(t0 + dur); return s;
  }
  function filt(type, f, q = 0.7) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

    g.gain.exponentialRampToValueAtTime(peak, t0 + attack); if (hold) g.gain.setValueAtTime(peak, t0 + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + decay); return g;
  }

    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; cv[i] = Math.tanh(x * drive) / Math.tanh(drive); }

  // 60 Hz chip voice: frame-stepped volume envelope and pitch slide, like an 8-bit sound driver
  const FR = 1 / 60;
  function chip(t0, f, dur, wave = 'p50', vol = 0.07, o = {}) {
    const frames = Math.max(1, Math.round(dur / FR)), t1 = t0 + frames * FR;
    const v = osc(wave, f, t0, t1 + 0.03), g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
    const sustain = o.sustain == null ? 0.55 : o.sustain;
    for (let k = 0; k < frames; k++) {
      const x = k / frames, env = k === 0 ? 1 : k < 3 ? 1 - (1 - sustain) * (k / 3) : sustain * Math.pow(1 - x, o.release || 0.6);
      g.gain.setTargetAtTime(vol * env, t0 + k * FR, 0.0015);
      if (o.slide) v.frequency.setValueAtTime(f * Math.pow(o.slide, x), t0 + k * FR);
      if (o.vib && k > 4) v.frequency.setValueAtTime(f * (1 + o.vib * ((k & 2) ? 1 : -1)), t0 + k * FR);

  }
  function chipNoise(t0, dur, vol = 0.05, hp = 1000, bus) {
    const frames = Math.max(1, Math.round(dur / FR)), g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
    for (let k = 0; k < frames; k++) g.gain.setTargetAtTime(vol * Math.pow(1 - k / frames, 1.5), t0 + k * FR, 0.0015);
    g.gain.setTargetAtTime(0, t0 + frames * FR, 0.003);

  }
  // tiny sequencer: tracks of [midi|0 (rest), sixteenths]
  function seq(t0, step, tracks) {
    let end = t0;
    for (const tr of tracks) {
      let t = t0;
      for (const [m, len] of tr.notes) {
        const d = len * step;
        if (m) { if (tr.noise) chipNoise(t, Math.min(d, tr.len || 0.08), tr.vol, m); else chip(t, mtof(m), d * (tr.gate || 0.9), tr.wave, tr.vol, tr.o || {}); }

  // ---- weapon -------------------------------------------------------------------
  function crackAt(t, vol, bus) {
    const s = ctx.createBufferSource(); s.buffer = A.nwave; s.start(t);

    return g;

  // .50 cal report: N-wave crack + saturated muzzle blast + brake bark + chest boom; city slap-back via the reverb
  function shot() {
    if (!ctx) return; const t = now(), R = A.reportIn;

    A.report.gain.cancelScheduledValues(t); A.report.gain.setValueAtTime(1, t);
    A.verbLP.frequency.cancelScheduledValues(t); A.verbLP.frequency.setValueAtTime(9000, t);
    crackAt(t, 0.9, R);

    const lp = filt('lowpass', 9000, 0.9);
    lp.frequency.setValueAtTime(11000, t); lp.frequency.exponentialRampToValueAtTime(2600, t + 0.03); lp.frequency.exponentialRampToValueAtTime(320, t + 0.4);
    let g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.0, t + 0.0008);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.04); g.gain.exponentialRampToValueAtTime(0.04, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);

    g = gainAD(t, 0.95, 0.002, 0.42); o.connect(g).connect(R);
    o = osc('triangle', 120, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(48, t + 0.18);
    g = gainAD(t, 0.45, 0.001, 0.22); o.connect(shaper(1.6)).connect(g).connect(R);

    g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);

  function crack(dist = 10, pan = 0) {
    if (!ctx) return; const t = now(), v = Math.min(0.95, 6 / Math.max(2, dist));

      { wave: 'p12', vol: 0.025, notes: [[0, 1], [67, 2], [72, 2], [76, 2], [79, 4], [76, 2], [79, 7]], o: { sustain: 0.5 } },
      { wave: 'triangle', vol: 0.16, notes: [[48, 4], [43, 4], [48, 4], [43, 2], [48, 6]], gate: 0.8, o: { sustain: 0.9 } },
      { noise: true, vol: 0.05, len: 0.05, notes: [[3000, 1], [3000, 1], [3000, 2], [3000, 4], [3000, 4], [3000, 2], [3000, 6]] },
    ]);

      { wave: 'triangle', vol: 0.15, notes: [[48, 2], [55, 2], [60, 2], [48, 6]], gate: 0.85, o: { sustain: 0.9 } },

      const loop = () => { sirenTimer = setTimeout(loop, rnd(28000, 65000)); if (ctx && ctx.state === 'running' && !muted && !flight) siren(); };
      sirenTimer = setTimeout(loop, rnd(9000, 20000));
    }
  }
  // far-off siren: wailing sine/triangle pair, heavily filtered, swims in the city reverb
  function siren(dur = 7) {
    if (!ctx) return; const t = now(), base = rnd(700, 820), p = panner(rnd(-0.8, 0.8));
    const o1 = osc('triangle', base, t, t + dur), o2 = osc('sine', base * 2.01, t, t + dur);
    const lfo = osc('sine', 1 / 3.4, t, t + dur), lg = ctx.createGain(); lg.gain.value = base * 0.42; lfo.connect(lg); lg.connect(o1.frequency);
    const lg2 = ctx.createGain(); lg2.gain.value = base * 0.84; lfo.connect(lg2); lg2.connect(o2.frequency);
    o1.frequency.linearRampToValueAtTime(base * 0.94, t + dur); // drifting away
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + dur * 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(g); o2.connect(g2).connect(g); g.connect(filt('lowpass', 1500)).connect(p).connect(A.amb); g.connect(A.verbIn);
  }
  // ---- fire mission (mortar) ----------------------------------------------------------------
  // loading: the fins clink on the muzzle, the bomb slides down, seats with a hollow thunk, the tube rings
  function mortarLoad() {
    if (!ctx) return; const t = now();
    for (const [f, v, d] of [[2380, 0.07, 0.25], [3710, 0.045, 0.18], [5230, 0.03, 0.12]]) { const o = osc('sine', f, t, t + d + 0.05), g = gainAD(t, v, 0.001, d); o.connect(g).connect(A.sfx); }
    const nb = filt('bandpass', 2200, 2); nb.frequency.setValueAtTime(2200, t + 0.03); nb.frequency.exponentialRampToValueAtTime(500, t + 0.3);
    let g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t + 0.03); g.gain.exponentialRampToValueAtTime(0.12, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    noise(t + 0.03, 0.32).connect(nb).connect(g).connect(A.sfx);
    const tt = t + 0.32;
    const o = osc('sine', 150, tt, tt + 0.5); o.frequency.exponentialRampToValueAtTime(70, tt + 0.25);
    g = gainAD(tt, 0.85, 0.002, 0.3); o.connect(g).connect(A.sfx);
    g = gainAD(tt, 0.5, 0.001, 0.08); noise(tt, 0.12).connect(filt('lowpass', 900)).connect(g).connect(A.sfx);
    for (const [f, v, d] of [[330, 0.12, 0.9], [612, 0.06, 0.6], [1180, 0.035, 0.4]]) { const r = osc('sine', f, tt, tt + d + 0.1), rg = gainAD(tt, v, 0.004, d); r.connect(rg).connect(A.sfx); rg.connect(A.verbIn); }
  }
  // the launch: a deep, hollow thoomp out of the tube
  function mortarFire() {
    if (!ctx) return; const t = now();
    const o = osc('sine', 85, t, t + 1.0); o.frequency.exponentialRampToValueAtTime(32, t + 0.7);
    let g = gainAD(t, 1.0, 0.003, 0.7); o.connect(g).connect(A.sfx);
    g = gainAD(t, 0.9, 0.002, 0.45); noise(t, 0.5).connect(filt('bandpass', 260, 3)).connect(g).connect(A.sfx); g.connect(A.verbIn);
    g = gainAD(t, 0.6, 0.001, 0.12); noise(t, 0.15).connect(filt('lowpass', 1500)).connect(g).connect(A.sfx);
    const r = osc('sine', 300, t, t + 0.9), rg = gainAD(t, 0.08, 0.004, 0.7); r.connect(rg).connect(A.sfx);
  }
  // the nose popping open at the top of the arc
  function mortarSplit() {
    if (!ctx) return; const t = now();
    let g = gainAD(t, 0.5, 0.0005, 0.06); noise(t, 0.1).connect(filt('highpass', 1200)).connect(g).connect(A.sfx); g.connect(A.verbIn);
    g = gainAD(t, 0.4, 0.002, 0.15); const o = osc('sine', 220, t, t + 0.25); o.frequency.exponentialRampToValueAtTime(90, t + 0.15); o.connect(g).connect(A.sfx);
  }
  // falling whistle of the cones coming down
  function whistle(dur = 3) {
    if (!ctx) return; const t = now();
    const o = osc('sine', 2600, t, t + dur + 0.05); o.frequency.exponentialRampToValueAtTime(900, t + dur);
    const lfo = osc('sine', 5.5, t, t + dur), lg = ctx.createGain(); lg.gain.value = 18; lfo.connect(lg).connect(o.frequency);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + dur * 0.85); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
    o.connect(g).connect(A.sfx); g.connect(A.verbIn);
  }
  function windLevel(v) { if (!amb) return; const t = now(); amb.wg.gain.setTargetAtTime(0.022 + 0.004 * v, t, 0.5); amb.lpL.frequency.setTargetAtTime(300 + 30 * v, t, 0.5); amb.lpR.frequency.setTargetAtTime(280 + 30 * v, t, 0.5); }
  function toggleMute() { muted = !muted; Store.set('muted', muted); if (A) A.master.gain.setTargetAtTime(muted ? 0 : MASTER, now(), 0.02); return muted; }

  // ---- offline rendering (test probe) --------------------------------------------------------
  // events: [{ t, fn, args }] run at render time via OfflineAudioContext.suspend
  async function renderOffline(fn, args = [], seconds = 2, events = [], sr = 48000) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const oc = new OAC(2, Math.ceil(sr * seconds), sr);
    const saved = [ctx, A, flight, amb]; const api = Sfx;
    ctx = oc; A = makeGraph(oc); flight = null; amb = null;
    try {
      if (fn === 'ambience') startAmbience(); else if (fn) api[fn](...args);
      const groups = new Map();
      for (const ev of events) { const k = Math.round(ev.t * sr / 128) * 128 / sr; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(ev); }
      for (const [k, evs] of groups) oc.suspend(k).then(() => { for (const ev of evs) api[ev.fn](...(ev.args || [])); oc.resume(); });
      const buf = await oc.startRendering();
      return [buf.getChannelData(0), buf.getChannelData(1)];
    } finally { [ctx, A, flight, amb] = saved; }
  }

  return {
    init, shot, crack, blip, arp, coin, tick, lock, deny, hit, miss, impactThud, ricochet, glass, boom, bodyThud, hatLand, heartbeat, staticBurst,
    stageStart, gameOver, victory, bonus, whoosh, siren, flightStart, flightUpdate, flightStop, windLevel, toggleMute, renderOffline, slowDive, slowWorld, worldResume,
    mortarLoad, mortarFire, mortarSplit, whistle,
    get muted() { return muted; }, get ctx() { return ctx; },
  };
})();

// ==== 02_materials.js ====
// ---------------------------------------------------------------------------
// Thermal materials. Every scene material writes:
//   R = apparent temperature (0 cold sky .. 1 hot skin)
//   G = facet code (normal-derived; used for vector edge lines in post)
//   B = log depth (for edge lines + fog)
// ---------------------------------------------------------------------------
const GLSL_LIB = /* glsl */`
uniform float uTime; uniform vec3 uCam; uniform float uFogD; uniform float uHaze;
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash31(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), u.x), mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), u.x), u.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; } return s; }
float fbm2(vec2 p){ return 0.667*vnoise(p) + 0.333*vnoise(p*2.03 + 17.1); }
// box-filtered periodic pulse (anti-aliased procedural stripes)
float pint(float x, float a, float b){ return floor(x)*(b-a) + clamp(fract(x), a, b) - a; }
float fpulse(float x, float a, float b, float w){ w = max(w, 1e-4); return clamp((pint(x+0.5*w,a,b) - pint(x-0.5*w,a,b))/w, 0.0, 1.0); }
float band(float x, float c, float hw){ float fw = max(fwidth(x), 1e-4); return clamp((hw - abs(x - c))/fw + 0.5, 0.0, 1.0) * min(1.0, 2.0*hw/fw); }
float sstep(float a, float b, float x){ return smoothstep(a, b, x); }
// fog: clear to ~300 m, gathering from ~400 m (about 25 % at 1 km, 65 % at 2 km)
float fogF(vec3 wp){ float x = max(length(wp - uCam) - 300.0, 0.0) * uFogD * 1.75; return 1.0 - exp(-x*sqrt(x)); }
vec4 thermalOut(float t, vec3 wp, vec3 n){
  vec3 V = normalize(uCam - wp);
  t *= 0.88 + 0.12*abs(dot(V, n));               // emissivity falls off at grazing angles
  // hot sources punch through the haze (a person at 2 km must still be the hottest thing in view)
  t = mix(t, uHaze + 0.015, fogF(wp) * mix(1.0, 0.35, sstep(0.5, 0.75, t)));
  float facet = 0.5 + 0.5*dot(n, vec3(0.267, 0.802, 0.535));
  float d = length(wp - uCam);
  return vec4(t, facet, log2(1.0 + d) / 13.0, 1.0);
}
vec3 flatN(vec3 wp){ return normalize(cross(dFdx(wp), dFdy(wp))); }
// City surfaces: three depth layers. Contrast and facet-edge strength fall off toward the
// skyline, and a faint haze hangs over the streets.
vec4 thermalOutC(float t, vec3 wp, vec3 n){
  float d = length(wp - uCam);
  // middle and skyline layers lose contrast toward the dark night haze; street canyons hold a
  // faint low haze that stays below roughly street-canyon height
  float far = sstep(900.0, 3500.0, d) * 0.2;
  float low = exp(-max(wp.y, 0.0) / 7.0) * sstep(120.0, 900.0, d) * 0.3;
  t = mix(t, uHaze + 0.02, clamp(far + low, 0.0, 0.8));
  vec4 o = thermalOut(t, wp, n);
  o.g = 0.5 + (o.g - 0.5) * (1.0 - 0.75*sstep(250.0, 2200.0, d));
  return o;
}
`;

const VS_STD = /* glsl */`
attribute float aSeed; attribute float aStyle;
varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vS; varying float vSeed; varying float vStyle; varying float vTop;
void main(){
  mat4 m = modelMatrix;
  #ifdef USE_INSTANCING
  m = m * instanceMatrix;
  #endif
  vec4 wp = m * vec4(position, 1.0);
  vW = wp.xyz; vL = position;
  vS = vec3(length(m[0].xyz), length(m[1].xyz), length(m[2].xyz));
  vN = normalize(mat3(m) * (normal / max(vS*vS, vec3(1e-6))));
  vSeed = aSeed; vStyle = aStyle;
  vTop = (m * vec4(0.0, 1.0, 0.0, 1.0)).y;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

// Parapet ring: one instance per roof. Inner-wall vertices (aIn = 1) are pulled in
// by a fixed wall thickness in metres, independent of the instance's xz scale.
const VS_RING = /* glsl */`
attribute float aSeed; attribute float aStyle; attribute float aIn;
uniform float uRingT;
varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vS; varying float vSeed; varying float vStyle; varying float vTop;
void main(){
  mat4 m = modelMatrix;
  #ifdef USE_INSTANCING
  m = m * instanceMatrix;
  #endif
  vS = vec3(length(m[0].xyz), length(m[1].xyz), length(m[2].xyz));
  vec3 p = position;
  if (aIn > 0.5) p.xz = sign(p.xz) * max(vec2(0.5) - vec2(uRingT) / max(vS.xz, vec2(1e-3)), vec2(0.0));
  vec4 wp = m * vec4(p, 1.0);
  vW = wp.xyz; vL = p;
  vN = normalize(mat3(m) * (normal / max(vS*vS, vec3(1e-6))));
  vSeed = aSeed; vStyle = aStyle;
  vTop = (m * vec4(0.0, 1.0, 0.0, 1.0)).y;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const VARY = 'varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vS; varying float vSeed; varying float vStyle; varying float vTop;\n';

function thermalMat(frag, extra = {}, opts = {}) {
  return new THREE.ShaderMaterial(Object.assign({
    uniforms: Object.assign({}, U, extra),
    vertexShader: VS_STD,
    fragmentShader: GLSL_LIB + VARY + frag,
  }, opts));
}

// Buildings and structural boxes. No discard in here (keeps early-z on the
// city's biggest draw call). Temperatures are kept below ~0.45 so the man, the muzzle
// and the bullet own the top of the gain range. Styles:
//   0 glass curtain wall   1 brick residential   2 concrete office   3 plain structure
//   4 warm panel / sign    5 skybridge           7 corrugated metal shed
//   8 steel / cable (cold) 9 helipad slab        10 art-deco stone
//   11 parking structure   12 stair bulkhead (door + louvre)
const FS_BUILDING = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  float seed = vSeed;
  int st = int(vStyle + 0.5);
  // per-building base temperature: wide spread so neighbours separate in every palette
  float base = (st == 0 ? 0.300 : st == 1 ? 0.350 : st == 7 ? 0.290 : st == 10 ? 0.342 : st == 11 ? 0.326 : 0.322) + 0.07*(seed - 0.5);
  float t = base;
  // detail that only resolves close up: fades in with screen-space size (metres per pixel)
  float mpp = max(length(fwidth(vW)), 1e-4);
  float nearK = 1.0 - sstep(0.05, 0.16, mpp);
  float midK = 1.0 - sstep(0.2, 0.7, mpp);
  float fwy = max(fwidth(vW.y), 1e-4);
  float fromTop = vTop - vW.y;
  bool xFace = abs(n.x) > 0.5;
  float faceW = xFace ? vS.z : vS.x;
  float u = ((xFace ? vL.z : vL.x) + 0.5) * faceW;
  float faceId = xFace ? (n.x > 0.0 ? 1.0 : 2.0) : (n.z > 0.0 ? 3.0 : 4.0);
  if (st == 8) {
    t = 0.27 + 0.02*seed;   // cold steel: darker than walls, but a readable mid-dark grey, never a black slab
  } else if (st == 13) {
    // exhaust caps / chimney pots: small hot accents, below the man
    t = mix(0.36, 0.47 + 0.05*seed, sstep(0.0, 0.6, 1.0 - fromTop/max(vS.y, 1e-3)) * 0.3 + 0.7*step(0.5, n.y));
    t = max(t, 0.42 + 0.04*seed);
  } else if (st == 14) {
    // equipment curb: roof warmed by the unit standing on it, fading toward the edges
    vec2 q = abs(vL.xz)*2.0;
    float r = max(q.x, q.y);
    t = n.y > 0.5 ? mix(0.30, 0.235, sstep(0.45, 1.0, r)) : 0.26;
  } else if (st == 15) {
    // street steam grate: warm slots
    vec2 q = vL.xz * vS.xz;
    float slot = fpulse(q.x/0.2, 0.0, 0.5, fwidth(q.x/0.2)) * (1.0 - sstep(0.15, 0.35, fwidth(q.x/0.2)));
    t = n.y > 0.5 ? 0.40 + 0.04*slot : 0.33;
  } else if (st == 9) {
    // helipad: painted circle + H on a cold deck
    t = 0.235;
    if (n.y > 0.5) {
      vec2 q = vL.xz * vS.xz; float R = 0.42*min(vS.x, vS.z);
      float r = length(q);
      float ring = band(r, R, 0.32);
      vec2 h = abs(q) / R;
      float H = (step(h.x, 0.42) * step(h.y, 0.55)) * max(step(0.28, h.x), step(h.y, 0.07));
      t = mix(t, 0.30, max(ring, H));
    }
  } else if (st == 3 || st == 4 || st == 5 || st == 12) {
    // plain structural elements: parapets, bulkheads, masts, bridges
    t = base - 0.012 + 0.015*(vnoise(vW.xz*0.5 + vW.y*0.3) - 0.5);
    if (n.y > 0.5) t = 0.235;
    else {
      // coping cap along the top edge
      t += 0.02*clamp((0.14 - fromTop)/fwy + 0.5, 0.0, 1.0) * midK;
      if (st == 12) {
        float y0 = vW.y - (vTop - vS.y);
        float doorF = 1.0 + floor(fract(seed*3.7)*4.0);
        float dc = faceW*0.5;
        float door = step(abs(faceId - doorF), 0.5) * clamp((0.55 - abs(u - dc))/fwidth(u) + 0.5, 0.0, 1.0) * clamp((2.15 - y0)/fwy + 0.5, 0.0, 1.0);
        float frameD = door * (1.0 - clamp((0.47 - abs(u - dc))/fwidth(u) + 0.5, 0.0, 1.0) * clamp((2.07 - y0)/fwy + 0.5, 0.0, 1.0));
        t = mix(t, 0.37, door * midK);                 // door leaks stairwell heat
        t = mix(t, 0.30, frameD * nearK);
        float louv = step(0.5, abs(faceId - doorF)) * step(abs(u - dc), 0.6) * step(abs(fromTop - 0.8), 0.35);
        t = mix(t, 0.33 - 0.03*fpulse(y0*7.0, 0.0, 0.5, fwidth(y0*7.0)), louv * nearK);
      }
    }
    if (st == 4 && abs(n.y) < 0.5) {
      // lit sign panel: lamps along the top edge heat the face, cools downward
      float yy = (vW.y - (vTop - vS.y)) / max(vS.y, 1e-3);
      float fr = max(band(yy, 0.04, 0.04), band(u/max(faceW, 1e-3), 0.02, 0.02) + band(u/max(faceW, 1e-3), 0.98, 0.02));
      t = 0.315 + 0.07*yy*yy;
      t = mix(t, 0.27, clamp(fr, 0.0, 1.0)*midK);
    }
    if (st == 5) { // skybridge: glazed band
      float yy = (vW.y - (vTop - vS.y));
      float g = band(yy, vS.y*0.52, vS.y*0.3);
      float lit = step(0.55, hash21(vec2(floor((vW.x+vW.z)/3.0), seed*40.0)));
      float spandrel = band(yy, vS.y*0.12, vS.y*0.06);
      t = mix(0.345, mix(0.27, 0.42, lit), g * step(abs(n.y), 0.5));
      t = mix(t, 0.37, spandrel * step(abs(n.y), 0.5));
      if (n.y > 0.5) t = 0.25;
      if (n.y < -0.5) t = 0.40;                       // heated corridor floor: warm underside
    }
  } else if (n.y > 0.5) {
    // roofs radiate to the cold sky: coldest surfaces in the city; membrane seams close up
    float g = fbm2(vW.xz*0.13 + seed*31.0);
    t = 0.212 + 0.03*(g - 0.5) + 0.02*(seed - 0.5);
    t += 0.012*(vnoise(vW.xz*0.7 + seed*5.0) - 0.5) * midK;      // gravel ballast
    vec2 sc = vW.xz / vec2(1.0, 6.0);
    t += 0.012*fpulse(sc.x, 0.0, 0.05, fwidth(sc.x))*nearK + 0.008*fpulse(sc.y, 0.0, 0.02, fwidth(sc.y))*nearK;
    // membrane panels (2 x 6 m) with their own tone, tar patches, roof drains
    t += 0.012*(hash21(floor(vW.xz / vec2(2.0, 6.0)) + seed*9.0) - 0.5)*midK;
    float tar = sstep(0.62, 0.66, vnoise(vW.xz*0.09 + seed*13.0));
    t = mix(t, t + 0.018, tar*midK);
    vec2 dq = mod(vW.xz + seed*37.0, 12.0) - 6.0;
    t -= 0.02*clamp((0.28 - length(dq))/max(fwidth(length(dq)), 1e-4) + 0.5, 0.0, 1.0)*nearK;
    if (st == 11) t += 0.03;                          // parking deck keeps a little heat
  } else if (n.y < -0.5) {
    t = base + 0.02;
  } else if (st == 11) {
    // parking structure: open decks, concrete upstands, columns, a few warm engines
    float ly = vW.y / 3.2; float fl = fwidth(ly);
    float open = fpulse(ly, 0.36, 0.92, fl) * clamp((fromTop - 0.4)/fwy + 0.5, 0.0, 1.0);
    float col = fpulse(u/7.5, 0.0, 0.07, fwidth(u/7.5));
    float car = step(0.55, hash21(vec2(floor(u/2.6), floor(ly) + seed*17.0))) * fpulse(u/2.6, 0.15, 0.85, fwidth(u/2.6)) * fpulse(ly, 0.36, 0.62, fl);
    t = base + 0.015*fpulse(ly, 0.0, 0.12, fl);
    t = mix(t, mix(0.262, 0.385, car*midK), open*(1.0 - col));
  } else {
    float colW = st == 0 ? 1.9 : st == 1 ? 3.0 : st == 7 ? 6.0 : st == 10 ? 2.6 : 2.8;
    float flH  = st == 0 ? 3.9 : st == 1 ? 3.5 : st == 7 ? 6.5 : st == 10 ? 3.8 : 3.8;
    float corner = st == 0 ? 0.7 : 1.5;
    float usable = max(faceW - 2.0*corner, 0.5);
    float N = max(1.0, floor(usable/colW + 0.5));
    float cx = (u - corner) / usable * N;
    float gf = 5.0;
    float cy = (vW.y - gf) / flH;
    vec2 fw = max(fwidth(vec2(cx, cy)), vec2(1e-4));
    float mx = st == 0 ? 0.07 : st == 1 ? 0.28 : st == 2 ? 0.08 : st == 10 ? 0.30 : 0.38;
    float my0 = st == 0 ? 0.32 : st == 1 ? 0.30 : st == 2 ? 0.36 : st == 7 ? 0.70 : 0.32;
    float my1 = st == 0 ? 0.80 : st == 1 ? 0.76 : st == 2 ? 0.78 : st == 7 ? 0.88 : 0.77;
    float wx = fpulse(cx, mx, 1.0 - mx, fw.x);
    float wy = fpulse(cy, my0, my1, fw.y);
    float inC = clamp(cx/fw.x + 0.5, 0.0, 1.0) * clamp((N - cx)/fw.x + 0.5, 0.0, 1.0);
    float topStop = (st == 1 || st == 10) ? 2.4 : 1.6;   // classic blocks keep room for a cornice
    float inR = clamp(cy/fw.y + 0.5, 0.0, 1.0) * clamp((vTop - topStop - vW.y)/fwy + 0.5, 0.0, 1.0);
    vec2 id = floor(vec2(cx, cy));
    float suite = hash31(vec3(floor(id.x/3.0), id.y, seed*113.0 + faceId));
    float h = hash31(vec3(id, seed*71.0 + faceId*13.0));
    float litFrac = (st == 7 ? 0.03 : 0.05) + 0.13*fract(seed*7.31);
    float lit = step(1.0 - litFrac, suite*0.75 + h*0.25);
    // glass is a dim mirror of the sky: mid-dark, colder toward the top of each pane
    float pane = clamp((fract(cy) - my0)/(my1 - my0), 0.0, 1.0);
    float glass = 0.248 + 0.02*h - 0.012*pane;
    float warm = 0.41 + 0.03*h;                        // occupied, heated rooms: warm, never white
    float wT = mix(glass, warm, lit);
    float open = step(0.985, hash31(vec3(id, seed*29.0 + faceId*7.0))) * step(0.5, fract(seed*19.3)) * float(st != 0 && st != 7);
    wT = mix(wT, 0.46 + 0.04*h, open);
    float lod = sstep(0.25, 0.9, max(fw.x, fw.y));
    float win = wx*wy*inC*inR;
    // window frames: thin warm surround, only once the frame spans a pixel
    float fx = 0.08/colW, fy = 0.08/flH;
    float glassA = fpulse(cx, mx + fx, 1.0 - mx - fx, fw.x) * fpulse(cy, my0 + fy, my1 - fy, fw.y) * inC * inR;
    float frame = clamp(win - glassA, 0.0, 1.0) * nearK;
    float meanWin = mix(0.245, 0.385, litFrac);
    // floor bands at every slab line (thermal bridges)
    float slab = fpulse(cy, -0.025, 0.025, fw.y) * inR;
    t = base + 0.02*slab*midK;
    if (st == 0) {
      // curtain wall: spandrel panels are warmer than the vision glass, mullions are thermal bridges
      float mulK = sstep(1.2, 2.5, 0.08/max(fw.x, 1e-4));          // mullion at least ~2 px wide
      t = base + 0.015*slab + 0.02*fpulse(cx, -0.04, 0.04, fw.x)*inR*mulK;
    } else if (st == 7) {
      // corrugated metal: low emissivity, vertical ribs
      float rib = vW.x*1.6 + vW.z*1.6;
      t = base + 0.014*fpulse(rib, 0.0, 0.5, fwidth(rib)) * (1.0 - sstep(0.12, 0.25, fwidth(rib)));
    } else if (st == 10) {
      // art-deco pilasters between the window stacks
      t = base + 0.02*(1.0 - fpulse(cx, 0.18, 0.82, fw.x)) + 0.02*slab*midK;
    }
    float wMean = mix(t, meanWin, (1.0 - 2.0*mx) * (my1 - my0));
    float tw = mix(t, wT, win);
    tw = mix(tw, base + 0.018, frame);
    // sills: a cold projecting ledge under each punched window
    if (st == 1 || st == 2 || st == 10) {
      float sill = fpulse(cx, mx - 0.04, 1.0 - mx + 0.04, fw.x) * fpulse(cy, my0 - 0.045, my0, fw.y) * inC * inR;
      tw = mix(tw, base - 0.03, sill * midK);
    }
    t = mix(tw, wMean, lod);
    if (st == 1) {
      // AC units under some windows
      float ac = step(0.94, hash31(vec3(id, seed*5.0 + faceId))) * fpulse(cx, 0.35, 0.65, fw.x) * fpulse(cy, 0.12, 0.27, fw.y) * inR * inC;
      t = mix(t, 0.40, ac * (1.0 - lod));
      // fire escape on one face of some walk-ups: platforms, rails and zig-zag stairs
      float feOn = step(0.4, fract(seed*5.13)) * step(abs(faceId - (1.0 + floor(fract(seed*3.7)*4.0))), 0.5);
      float k0 = floor(fract(seed*11.3) * max(N - 2.0, 1.0));
      float lx = (cx - k0) / 2.0;
      float inFE = feOn * step(0.0, lx) * step(lx, 1.0) * step(gf + flH*0.7, vW.y) * inR;
      if (inFE > 0.0) {
        float fy2 = cy - my0 + 0.12;
        float ly = fract(fy2);
        float plat = fpulse(fy2, 0.0, 0.085, fw.y);
        float rail = fpulse(fy2, 0.29, 0.33, fw.y);
        float post = fpulse(lx*4.0, 0.0, 0.08, fwidth(lx*4.0)) * step(ly, 0.33);
        float sx = mix(lx, 1.0 - lx, mod(floor(fy2), 2.0));
        float stair = max(band(sx - ly, 0.0, 0.055), band(sx - ly, 0.09, 0.025));
        float steel = max(max(plat, max(rail, post)*0.85), stair) * (1.0 - lod);
        t = mix(t, 0.245, steel * inFE);
      }
    }
    // cornice on classic blocks: cold projecting band with a warm lip
    if (st == 1 || st == 10) {
      float cor = clamp((fromTop - 0.35)/fwy + 0.5, 0.0, 1.0) * clamp((1.15 - fromTop)/fwy + 0.5, 0.0, 1.0);
      float lip = clamp((fromTop - 1.15)/fwy + 0.5, 0.0, 1.0) * clamp((1.32 - fromTop)/fwy + 0.5, 0.0, 1.0);
      t = mix(t, base - 0.025, cor);
      t = mix(t, base + 0.02, lip * midK);
    }
    // street level: storefronts, or roll-up doors on sheds
    float sfTop = st == 7 ? 4.6 : 4.1;
    float sf = clamp((vW.y - 0.6)/fwy + 0.5, 0.0, 1.0) * clamp((sfTop - vW.y)/fwy + 0.5, 0.0, 1.0);
    float shop = hash31(vec3(floor(u/(st == 7 ? 9.0 : 6.0)), seed*7.0, faceId));
    if (st == 7) {
      float door = fpulse(u/9.0, 0.22, 0.78, fwidth(u/9.0));
      float ribs = fpulse(vW.y*3.0, 0.0, 0.5, fwidth(vW.y*3.0));
      float dT = step(0.8, shop) > 0.5 ? 0.39 : 0.30 + 0.012*ribs*midK;
      t = mix(t, dT, sf * step(0.35, shop) * door);
    } else {
      float sfT = 0.33 + 0.09*shop;
      t = mix(t, sfT, sf * step(0.3, shop) * fpulse(u/6.0, 0.08, 0.92, fwidth(u/6.0)));
    }
    t += 0.012*n.x - 0.006*n.z;
    t += 0.02*(1.0 - sstep(0.0, 14.0, vW.y));
  }
  gl_FragColor = thermalOutC(t, vW, n);
}`;

// Open steel lattice (masts, crane trusses, scaffolding, bridge trusses). Uses discard,
// so it lives in its own draw call. Bars are only cut out while they are wider than a
// pixel; further away the panel turns solid at the averaged temperature (no speckle).
const FS_LATTICE = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  bool xF = abs(n.x) > 0.5; bool yF = abs(n.y) > 0.5;
  float fwid = yF ? vS.x : (xF ? vS.z : vS.x);
  float u = yF ? (vL.x + 0.5)*vS.x : ((xF ? vL.z : vL.x) + 0.5)*fwid;
  float v = yF ? (vL.z + 0.5)*vS.z : vL.y*vS.y;
  float cell = yF ? min(vS.x, vS.z) : min(fwid, vS.y);
  cell = min(cell, 2.6);
  vec2 q = vec2(u, v)/cell; vec2 f = fract(q);
  float lw = 0.1;
  float px = max(fwidth(q.x), fwidth(q.y));
  float t0 = 0.295 + 0.03*(vSeed - 0.5);   // steel reads mid-dark grey, never a black void
  float t = t0;
  // cut the bars out only when they are several pixels wide; every cut-out bar is outlined by
  // the edge pass, so smaller ones would read as a bright smear
  if (px < 0.025) {
    float edge = max(max(step(f.x, lw), step(1.0-lw, f.x)), max(step(f.y, lw), step(1.0-lw, f.y)));
    float br = max(step(abs(f.x - f.y), lw), step(abs(f.x + f.y - 1.0), lw));
    if (max(edge, br) < 0.5) discard;
  } else {
    t = t0 - 0.012;                     // solid panel: bars averaged with the gaps
  }
  gl_FragColor = thermalOutC(t, vW, n);
}`;

// HVAC units: casings at wall temperature; only the fan discs run warm
const FS_HVAC = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  float mpp = max(length(fwidth(vW)), 1e-4);
  float nearK = 1.0 - sstep(0.04, 0.12, mpp);
  float t = 0.335 + 0.03*(vSeed - 0.5);
  if (n.y > 0.5) {
    vec2 c = vL.xz * vS.xz;
    float along = vS.x > vS.z ? c.x : c.y;
    float across = vS.x > vS.z ? c.y : c.x;
    float L = max(vS.x, vS.z), r = min(vS.x, vS.z)*0.36;
    float k = floor(L / (2.6*r)); k = max(k, 1.0);
    float cell = L / k;
    float lc = mod(along + 0.5*L, cell) - 0.5*cell;
    float d = length(vec2(lc, across));
    float fw = max(fwidth(d), 1e-4);
    float disc = clamp((r - d)/fw + 0.5, 0.0, 1.0);
    float hub = clamp((r*0.25 - d)/fw + 0.5, 0.0, 1.0);
    float lod = sstep(0.15, 0.6, fw/max(r, 1e-3));
    // fan guard: a ring and four spokes, close up only
    float ang = atan(across, lc);
    float spoke = fpulse(ang*0.6366, -0.06, 0.06, fwidth(ang*0.6366)) * nearK;
    float guard = band(d, r*0.62, 0.03) * nearK;
    t = mix(0.32, 0.46 + 0.06*vSeed, mix(disc, 0.35, lod));
    t = mix(t, 0.40, max(hub, max(spoke, guard)*disc)*(1.0 - lod));
  } else {
    // louvred casing with panel seams
    float y = vL.y * vS.y;
    float lv = y*3.5;
    t += 0.016*fpulse(lv, 0.0, 0.45, fwidth(lv)) * (1.0 - sstep(0.1, 0.25, fwidth(lv)));
    float uu = (abs(n.x) > 0.5 ? vL.z*vS.z : vL.x*vS.x);
    t -= 0.012*fpulse(uu/1.2, 0.0, 0.06, fwidth(uu/1.2)) * nearK;
  }
  gl_FragColor = thermalOutC(t, vW, n);
}`;

// Generic low-poly solid with flat facets (tanks, cones, cranes, figure parts)
const FS_SOLID = /* glsl */`
uniform float uT; uniform float uStripe;
void main(){
  vec3 n = flatN(vW);
  float t = uT + 0.05*(vSeed - 0.5);
  if (uStripe > 0.0) {
    float a = atan(vL.z, vL.x) * 12.0 / 3.14159;
    t += 0.018*fpulse(a, 0.0, 0.18, fwidth(a));
    float y = vL.y * vS.y;
    t += 0.03*fpulse(y/1.6, 0.0, 0.08, fwidth(y/1.6));
    t -= 0.035*(1.0 - vL.y);
  }
  gl_FragColor = thermalOut(t, vW, n);
}`;

// Faceted shapes with per-face temperature: sloped faces radiate to the sky (cold),
// vertical faces read as glazing (sawtooth north lights) or warm stone (crowns).
//   uKind 0: pyramid / crown cap   1: sawtooth roof   2: cooling tower shell   3: dish
const FS_SHAPE = /* glsl */`
uniform float uT; uniform float uKind;
void main(){
  vec3 n = flatN(vW);
  int k = int(uKind + 0.5);
  float t = uT + 0.05*(vSeed - 0.5);
  if (k == 1) {
    if (abs(n.y) < 0.3) {
      float y = vL.y;
      float g = fpulse(vW.x/1.5 + vW.z/1.5, 0.08, 0.92, fwidth(vW.x/1.5 + vW.z/1.5));
      float lit = step(0.72, hash21(vec2(floor((vW.x + vW.z)/12.0), vSeed*31.0)));
      t = mix(0.30, mix(0.25, 0.40, lit), g * step(0.12, y) * step(y, 0.9));
    } else t = 0.215 + 0.012*fpulse(vW.x/0.9 + vW.z/0.9, 0.0, 0.4, fwidth(vW.x/0.9 + vW.z/0.9));
  } else if (k == 2) {
    // hyperboloid cooling tower: warm, hottest near the lip (exhaust heats the shell)
    t = uT + 0.10*vL.y*vL.y + 0.02*(vSeed - 0.5);
    float y = vW.y / 2.2;
    t += 0.012*fpulse(y, 0.0, 0.12, fwidth(y));
    if (!gl_FrontFacing) t = 0.44 + 0.08*vL.y;
  } else if (k == 3) {
    // dish: grey bowl, darker inner face (it sees the cold sky), bright rim line
    float rim = 1.0 - sstep(0.88, 0.97, vL.y);
    t = gl_FrontFacing ? uT : uT - 0.035;
    t = mix(uT + 0.04, t, rim);
  } else {
    t += (n.y > 0.35 ? -0.03 : 0.02) + 0.015*fpulse(vW.y/2.0, 0.0, 0.15, fwidth(vW.y/2.0));
  }
  gl_FragColor = thermalOutC(t, vW, n);
}`;

// Cars: hot engine bay & exhaust, cold glass
const FS_CAR = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  vec3 l = vL;
  float t = 0.37 + 0.04*(vSeed - 0.5);
  if (l.y > 1.06) t = (n.y > 0.5) ? 0.33 : 0.27;
  if (l.z > 0.9 && l.y > 0.3 && l.y <= 1.06) t = mix(t, 0.50, sstep(0.9, 2.0, l.z));
  if (l.z > 2.1 && n.z > 0.5) t = 0.54;
  if (n.z < -0.5 && l.y < 0.62 && abs(l.x - 0.5) < 0.22) t = 0.64;
  if (l.y < 0.68 && abs(l.x) > 0.8) t = 0.44;
  gl_FragColor = thermalOutC(t, vW, n);
}`;

// Ground: roads, sidewalks, markings, manholes, river, parks
const FS_GROUND = /* glsl */`
uniform vec4 uGrid; uniform vec2 uGrid2; uniform vec4 uRiver; uniform vec4 uPark0; uniform vec4 uPark1;
float inRect(vec2 p, vec4 r){ return step(r.x, p.x) * step(p.x, r.z) * step(r.y, p.y) * step(p.y, r.w); }
void main(){
  vec2 p = vW.xz;
  float aveSp = uGrid.x, mainHW = uGrid.y, aveHW = uGrid.z, stSp = uGrid.w, stHW = uGrid2.x, sw = uGrid2.y;
  float ai = floor(p.x/aveSp + 0.5);
  float ax = p.x - ai*aveSp; float adx = abs(ax);
  bool isMain = abs(ai) < 0.5;
  float hwA = isMain ? mainHW : aveHW;
  float noAve = (isMain && p.y > stHW) ? 1.0 : 0.0;
  float si = floor(-p.y/stSp + 0.5);
  float sz = p.y + si*stSp; float sdz = abs(sz);
  float onA = (1.0 - noAve) * (1.0 - step(hwA, adx));
  float onS = (1.0 - step(stHW, sdz)) * step(p.y, stHW + 1.0) ;
  float road = max(onA, onS);
  float walkA = (1.0 - noAve) * (1.0 - step(hwA + sw, adx));
  float walk = max(walkA, (1.0 - step(stHW + sw, sdz)) * step(p.y, stHW + sw + 1.0)) * (1.0 - road);
  float n1 = fbm2(p*0.06);
  float t = 0.30 + 0.02*(n1 - 0.5);
  float water = uRiver.z * step(uRiver.x, p.y) * step(p.y, uRiver.y) * (1.0 - step(adx, hwA + sw));
  float park = max(inRect(p, uPark0), inRect(p, uPark1)) * (1.0 - walk) * (1.0 - road);
  if (water > 0.5) {
    // river: warmer than the night air, but a near-mirror for the cold sky at grazing angles
    vec3 V = normalize(uCam - vW);
    float fr = 0.03 + 0.97*pow(1.0 - clamp(V.y, 0.0, 1.0), 5.0);
    vec2 wp = vec2(p.x*0.05 + uTime*0.04, p.y*0.6);
    float rip = vnoise(wp) * vnoise(wp*2.7 + 3.1);
    t = mix(0.35 + 0.02*rip, 0.14 + 0.08*rip, fr*0.9);
  } else if (park > 0.5) {
    // grass radiates to the sky: colder than paving; gravel paths a touch warmer
    t = 0.255 + 0.025*(fbm2(p*0.35) - 0.5);
    float d1 = abs(fract((p.x + p.y)/38.0) - 0.5)*38.0, d2 = abs(fract((p.x - p.y)/38.0) - 0.5)*38.0;
    float path = max(band(d1, 0.0, 1.1), band(d2, 0.0, 1.1));
    t = mix(t, 0.30, path);
  } else if (road > 0.5) {
    t = 0.365 + 0.03*(n1 - 0.5) + 0.01*(vnoise(p*1.1) - 0.5);
    float paint = 0.0;
    if (onA > 0.5 && onS < 0.5) {
      paint += band(adx, 0.22, 0.07);
      float lane = adx / 3.4;
      float dash = fpulse(p.y/9.0, 0.0, 0.35, fwidth(p.y/9.0));
      for (int k = 1; k <= 4; k++) { if (float(k)*3.4 < hwA - 1.0) paint += band(adx, float(k)*3.4, 0.07) * dash; }
      float cw = step(stHW + 0.8, sdz) * step(sdz, stHW + 4.6);
      paint += cw * fpulse(ax/1.1, 0.0, 0.5, fwidth(ax/1.1));
      paint += band(sdz, stHW + 5.2, 0.2) * step(0.0, ax * sign(sz + 0.001));
      // tyre tracks are warmer
      t += 0.014*(0.5 + 0.5*cos(6.2832*(lane - 0.5)));
      // manholes
      vec2 mh = vec2(mod(ax + 1.7, 3.4) - 1.7, mod(p.y, 41.0) - 20.5);
      float md = length(mh);
      t = mix(t, 0.44, clamp((0.42 - md)/max(fwidth(md),1e-4) + 0.5, 0.0, 1.0) * step(0.7, hash21(floor(vec2(ax/3.4, p.y/41.0)))));
    } else if (onS > 0.5 && onA < 0.5) {
      paint += band(sdz, 0.15, 0.06) * fpulse(p.x/7.0, 0.0, 0.4, fwidth(p.x/7.0));
    }
    t -= 0.04*clamp(paint, 0.0, 1.0);
  } else if (walk > 0.5) {
    t = 0.318 + 0.012*(n1 - 0.5);
    vec2 g = p/1.6; vec2 fw = fwidth(g);
    t -= 0.012*max(fpulse(g.x, 0.0, 0.05, fw.x), fpulse(g.y, 0.0, 0.05, fw.y));
    float curbA = band(adx, hwA + 0.15, 0.15) * (1.0 - noAve);
    t += 0.03*curbA;
  }
  gl_FragColor = thermalOutC(t, vW, vec3(0.0, 1.0, 0.0));
}`;

const FS_SKY = /* glsl */`
void main(){
  vec3 d = normalize(vW - uCam);
  float h = d.y;
  float hc = clamp(h, 0.0, 1.0);
  float t = mix(uHaze, 0.08, sstep(0.0, 0.7, sqrt(hc)));     // faint glow of city heat along the horizon
  if (h > 0.0) {
    // cloud deck: real shapes, underlit by the city, darker and thinner toward the zenith
    vec2 cp = d.xz / (h + 0.1) * 0.9 + vec2(uTime*0.002, uTime*0.0007);
    float c = sstep(0.46, 0.78, fbm(cp*vec2(0.7, 1.2)));
    float lit = mix(0.17, 0.10, sstep(0.0, 0.45, h));
    t = mix(t, max(t, lit + 0.05*fbm(cp*3.1 + 4.0)), c * (1.0 - sstep(0.25, 0.75, h)));
  } else t = uHaze;
  gl_FragColor = vec4(t, 0.5, 1.0, 1.0);
}`;

// Point lights (aviation beacons, lamp heads) – always at least a few pixels wide
const LightPoints = (() => {
  const VS = /* glsl */`
  uniform float uTime; uniform float uScale; uniform vec3 uCam; uniform float uFogD; uniform float uHaze;
  attribute float aPhase; attribute float aKind; attribute float aSize;
  varying float vHeat;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    float d = -mv.z;
    float blink = aKind < 0.5 ? step(fract(uTime*0.5 + aPhase), 0.14) : 1.0;
    float heat = aKind < 0.5 ? mix(0.0, 0.72, blink) : 0.46;
    float f = 1.0 - exp(-d * uFogD * 0.8);
    vHeat = heat * (1.0 - f);
    gl_PointSize = clamp(aSize * uScale / d, 2.2, 48.0);
    gl_Position = projectionMatrix * mv;
  }`;
  const FS = /* glsl */`
  varying float vHeat;
  void main(){
    vec2 c = gl_PointCoord - 0.5; float r = length(c)*2.0;
    float a = exp(-r*r*5.0);
    if (r > 1.0) discard;
    gl_FragColor = vec4(vHeat * a, 0.0, 0.0, 1.0);
  }`;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uCam: U.uCam, uFogD: U.uFogD, uHaze: U.uHaze, uScale: { value: 500 } },
    vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  return { mat };
})();

// City copy of FS_SOLID (tanks, cones, trees) with depth layering
const FS_SOLID_C = FS_SOLID.replace('thermalOut(t, vW, n)', 'thermalOutC(t, vW, n)');

// Tanks: hoop bands only, smooth shading code so the post pass draws the silhouette, not every stave
const FS_TANK = /* glsl */`
uniform float uT;
void main(){
  vec3 n = normalize(vN);
  float t = uT + 0.03*(vSeed - 0.5);
  float y = vL.y * vS.y;
  t += 0.02*fpulse(y/1.6, 0.0, 0.08, fwidth(y/1.6)) * (1.0 - sstep(0.15, 0.4, fwidth(y/1.6)));
  t -= 0.025*(1.0 - vL.y);
  gl_FragColor = thermalOutC(t, vW, n);
}`;
// Night-time grade: dark horizon haze (sky glow and distant city settle near black-grey)
U.uHaze.value = 0.235;

// ==== 03_city.js ====
// ---------------------------------------------------------------------------
// City: procedural low-poly city, regenerated from a seed every stage.
// Provides collision (AABB grid), raycasts, rooftops for target spawns,
// heat emitters, traffic.
//
// Every seed rolls a "sector profile" (skyline height, tower archetypes, river,
// parks, industrial quarter, obstacle mix over the main avenue), so each stage
// reads as a different part of town. Detail is spent where the scope and the
// bullet can see it: lots inside the firing sector get full roof clutter and
// parapets, lots outside it are plain massing.
// ---------------------------------------------------------------------------
const City = (() => {
  const CELL = 32;
  const group = new THREE.Group();

  // ---- geometry ------------------------------------------------------------
  function polyGeo(polys) {
    // polys: [{ p: [[x,y,z]...3|4], n: [x,y,z], f: [flags] }] -> non-indexed, flat normals, winding fixed to n
    const P = [], N = [], F = [];
    for (const q of polys) {

  if (Target.S.type !== 'man' && Target.S.alive && G.tgtScreen.vis) {
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9, ok = true;
    camera.getWorldDirection(fwd);
    for (const p of Target.corners()) {
      if (tmpV2.subVectors(p, camera.position).dot(fwd) <= 0.5) { ok = false; break; }
      ndc.copy(p).project(camera); x0 = Math.min(x0, ndc.x); x1 = Math.max(x1, ndc.x); y0 = Math.min(y0, ndc.y); y1 = Math.max(y1, ndc.y);
    }
    if (ok) { G.tgtScreen.bw = (x1 - x0) / 2; G.tgtScreen.bh = (y1 - y0) / 2; }
  }
  if (G.state === 'killcam' || G.state === 'misscam') bodyBox(G.bodyBox); else G.bodyBox.vis = false;
  if (G.state === 'flight' && Bullet.S.active) {
    project(Bullet.S.p, G.roundScreen); for (let i = 0; i < PATH_N; i++) project(G.pathDraw[i], G.pathScreen[i]);
    G.bounceK = Bullet.S.pvBounceK;
    if (G.pathBlock >= 0) project(G.pathBlockP, G.blockScreen); else G.blockScreen.vis = false;
  } else { for (const p of G.pathScreen) p.vis = false; G.roundScreen.vis = false; G.blockScreen.vis = false; }
  if (G.state === 'misscam' && G.missGap) { project(Target.chest, G.missA); project(G.missP, G.missB); } else G.missA.vis = G.missB.vis = false;
  if (G.state === 'flight') coverBox(G.coverScreen); else G.coverScreen.vis = false;
  if (POINT && G.state === 'flight' && Bullet.S.active) project(G.aimLock ? Target.chest : G.aimP, G.aimScreen); else G.aimScreen.vis = false;
  // on-screen hint (early stages): which side of his cover is open
  G.coverBlocked = G.state === 'flight' && Bullet.S.active && Target.S.alive && !clearLine(Bullet.S.p, Target.chest, -0.6);
  // is he behind something from where the camera is (scope or chase cam)? the HUD marks him HIDDEN
  G.tgtHidden = Target.S.alive && (G.state === 'aim' || G.state === 'brief' || G.state === 'flight') && !clearLine(camera.position, Target.chest, -0.4);
  G.coverSide = Target.S.app ? Target.S.app.side : '';
  updatePipper(rdt);

  Input.pressed.clear(); Input.tap = null; Input.dx = Input.dy = Input.wheel = 0;
}

// Predicted-impact pipper as the player sees it: only after seeker lock, with sensor noise (metres at the
// target plane, so it is the same size at every range) and a display lag. The steering physics never use it.
const pipRaw = new THREE.Vector3(), tgtPrev = new THREE.Vector3();
G.tgtVel = new THREE.Vector3(); G.pipW = new THREE.Vector3(); G.lock = 0; G.whoosh = 0; G.nearMisses = 0;
function updatePipper(rdt) {
  const B = Bullet.S;
  G.lock = G.state === 'flight' && B.active ? B.lock : 0;
  if (G.state !== 'flight' || !B.active || B.lock < 1) { G.pipScreen.vis = false; G.pipInit = false; return; }
  Bullet.predict(Target.chest, pipRaw);
  const { r, u } = Bullet.frame();
  pipRaw.addScaledVector(r, B.pipErr.x).addScaledVector(u, B.pipErr.y);
  if (!G.pipInit) { G.pipW.copy(pipRaw); G.pipInit = true; }
  G.pipW.lerp(pipRaw, 1 - Math.exp(-rdt / Math.max(0.02, G.diff.pipLag || 0.08)));
  project(G.pipW, G.pipScreen);
}

// Near misses: the round threads past a structure within a few metres -> whoosh, camera kick, bonus
const NM_DIRS = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
function nearMissCheck(rdt) {
  G.nearCool = (G.nearCool || 0) - rdt; G.whoosh = Math.max(0, G.whoosh - rdt * 2.5);
  // skip the shooter's own rooftop and the final approach over the target's roof (that would trigger every time)
  if (G.nearCool > 0 || Bullet.S.travelled < 35 || G.tgtRange < 45) return;
  const { r, u } = Bullet.frame();
  NM_DIRS[0].copy(r); NM_DIRS[1].copy(r).negate(); NM_DIRS[2].copy(u); NM_DIRS[3].copy(u).negate();
  let dmin = 1e9;
  for (const d of NM_DIRS) if (City.raycast(Bullet.S.p, d, 4) && City.hit.id !== -2) dmin = Math.min(dmin, City.hit.t);
  if (dmin < 3.2) {
    G.nearCool = 1.1; G.whoosh = 1; G.shake = Math.max(G.shake, 0.8); G.nearMisses = Math.min(5, G.nearMisses + 1);
    if (Sfx.whoosh) Sfx.whoosh(1 - dmin / 3.2); else Sfx.staticBurst(0.06);
    toast('CLOSE CALL', 0.6);
  }
}

// ---- attract-mode demo: the autopilot plays a stage ----------------------------
function startDemo() {
  G.demoSave = { score: G.score, stage: G.stage };
  G.demo = true; G.score = G.scoreShown = 0; G.stage = 1 + Math.floor(grnd(0, 4)); G.rounds = G.maxRounds = 5;
  newStage(); G.staticAmt = 0.6;
}
function endDemo() {
  G.demo = false; G.auto = false;
  if (G.demoSave) { G.score = G.scoreShown = G.demoSave.score; G.stage = G.demoSave.stage; }
  Bullet.abort(); Bullet.hideRound(); Bullet.clearTrail(); Sfx.flightStop(); Target.hide(); FX.clear();
  G.toastT = 0; G.staticAmt = 0.6; setState('attract');
}
function demoAim(rdt) {
  const t = Target.S.spot && Target.S.spot.gate ? Target.S.spot.gate : Target.chest; const dx = t.x - PLAYER.eye.x, dy = t.y - PLAYER.eye.y, dz = t.z - PLAYER.eye.z;
  const wy = Math.atan2(-dx, -dz), wp = Math.atan2(dy, Math.hypot(dx, dz));
  Aim.yaw = damp(Aim.yaw, wy, 2.6, rdt); Aim.pitch = damp(Aim.pitch, wp, 2.6, rdt);
}

// ---- render -------------------------------------------------------------------
function render() {
  // test hook: a free camera for looking at things up close (window.__X.look)
  if (G.dbgView) { const v = G.dbgView; camera.position.copy(v.p); camera.up.set(0, 1, 0); camera.lookAt(v.t); camera.fov = v.fov || 40; camera.updateProjectionMatrix(); camera.updateMatrixWorld(); }
  const scopeOn = ['brief', 'aim', 'shot', 'gameover', 'initials', 'mload', 'escaped'].includes(G.state) ? 1 : 0;
  G.scopeAmt = scopeOn;
  const d = Post.display.uniforms, s = Post.sensor.uniforms;
  d.uMode.value = G.mode; d.uScope.value = G.scopeAmt; d.uScopeR.value = G.scopeR; d.uFlash.value = G.flash * 0.6;
  d.uStatic.value = G.staticAmt; d.uFade.value = G.fade;
  s.uPersist.value = G.state === 'flight' ? 0.08 : MODES[G.mode].persist;
  s.uNoise.value = G.mode === 2 ? 0.03 : 0.024;
  U.uCam.value.copy(camera.position);
  City.sky.position.copy(camera.position);
  const pxScale = (innerHeight * Post.pr) / (2 * Math.tan((camera.fov * DEG) / 2));
  FX.setScale(pxScale); City.setPointScale(pxScale);
  // body-heat glow (scope and flight only), about 2 % of the screen tall, never smaller than him
  const glowOn = Target.S.alive && Target.group.visible && (G.state === 'aim' || G.state === 'brief' || G.state === 'shot' || G.state === 'flight');
  manGlow.visible = glowOn;
  if (glowOn) {
    const dg = Math.max(1, camera.position.distanceTo(Target.chest));
    const sz = Math.max(2.4, dg * 2 * Math.tan(camera.fov * DEG / 2) * 0.022);
    manGlow.position.copy(Target.chest); manGlow.position.y += 0.1; manGlow.quaternion.copy(camera.quaternion); manGlow.scale.set(sz, sz, 1);
    // only while he is small on screen (a magnified view already shows him plainly)
    const hFrac = 1.8 / (2 * dg * Math.tan(camera.fov * DEG / 2));
    manGlow.material.uniforms.uHeat.value = 0.3 * clamp((dg - 25) / 60, 0, 1) * clamp((0.065 - hFrac) / 0.04, 0, 1);
  }
  Hud.draw(G);
  Post.render(scene, camera, Hud.tex);
}

function onResize() {
  Post.resize(innerWidth, innerHeight);
  Hud.resize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ---- boot -------------------------------------------------------------------
City.generate(newSeed());
Target.spawn(1); Target.hide();
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  tick(rdt); render(); Post.adapt(rdt);
}
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('20px "Press Start 2P"'), document.fonts.load('20px "VT323"')]).catch(() => {}) : Promise.resolve();
if (!TEST) fontsReady.then(() => requestAnimationFrame(loop));

// ---- test / debug hooks --------------------------------------------------------
window.__X = {
  G, Aim, City, Target, Bullet, Post, Hud, FX, Sfx, scene, renderer, camera, fontsReady, Input, Mortar,
  advance(sec, step = 1 / 60, draw = true) { const n = Math.max(1, Math.round(sec / step)); for (let i = 0; i < n; i++) tick(step); if (draw) render(); },
  key(code) { Input.pressed.add(code); },
  look(p, t, fov) { G.dbgView = p ? { p: p.clone(), t: t.clone(), fov } : null; },
  start() { startGame(); },
  aimAtTarget(lead = 0) {
    const t = Target.chest; const dx = t.x - PLAYER.eye.x, dy = t.y - PLAYER.eye.y, dz = t.z - PLAYER.eye.z;
    Aim.yaw = Math.atan2(-dx, -dz) + lead; Aim.pitch = Math.atan2(dy, Math.hypot(dx, dz));
  },
  setMag(i) { G.magI = i; G.mag = MAGS[i]; },
  spawnWith(o) { const ok = Target.spawn(G.stage, o); planHidden(); return ok; },
  spawnKind(k) { const ok = Target.spawn(G.stage, { kind: k }); planHidden(); return ok && Target.S.spot && Target.S.spot.kind === k; },
  aimAt(t) { const dx = t.x - PLAYER.eye.x, dy = t.y - PLAYER.eye.y, dz = t.z - PLAYER.eye.z; Aim.yaw = Math.atan2(-dx, -dz); Aim.pitch = Math.atan2(dy, Math.hypot(dx, dz)); },
  fire() { fire(); },
  // headless simulation without rendering (difficulty probes)
  sim(sec, step = 1 / 60) { const n = Math.max(1, Math.round(sec / step)); for (let i = 0; i < n; i++) tick(step); },
  startAt(stage) { G.score = 0; G.rounds = G.maxRounds = 5; G.stage = stage; newStage(); setState('aim'); },
  demo() { startDemo(); }, endDemo() { endDemo(); }, difficulty,
  clearLine(a, b, pad) { return clearLine(a, b, pad); }, flyable(s) { return routeFlyable(s); },
  routeTgt: routeT, RP, planHidden, routeFollow, pointSteerAt,
  setAim(p, lock = false) { if (p) G.aimP.copy(p); G.aimLock = lock; G.aimSpent = false; }, routeAimPoint(out) { return routeAim(out); },
  bot: null, routeStick(stick, gain, look) { return routeStick(stick || G.stick, gain, look); }, planOk() { return PLAN.ok; },
  setState, setMode(m) { G.mode = m; G.modeName = MODES[m].name; },
};

</script>
