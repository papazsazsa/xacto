<style>
  :root { --bg: #000; --ink: #cfe; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --ink: #cfe; } }
  :root[data-theme="dark"] { --bg: #000; --ink: #cfe; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas#game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: none; outline: none; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; color: var(--ink); font: 16px/1.5 monospace; text-align: center; background: var(--bg); }
</style>
<script>
  // inside an iframe the first click must also give the page keyboard focus
  window.addEventListener('pointerdown', function () { try { window.focus(); } catch (err) { /* ignore */ } }, true);
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    if (el && !document.getElementById('game')) { el.style.display = 'flex'; el.textContent = 'XACTO needs a browser with WebGL 2. (' + (e.message || 'error') + ')'; }
  });
</script>
