<div id="err"></div>
<script type="module">
// ==== 00_core.js ====
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// XACTO core: math helpers, RNG, shared uniforms, world constants
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const BASE_SEED = parseInt(QS.get('seed') || '', 10) || 0;

// City RNG is re-seeded every time a new city is generated.
let cityRand = mulberry32(1987);
const crnd = (a = 0, b = 1) => a + (b - a) * cityRand();
const reseedCity = (s) => { cityRand = mulberry32(s >>> 0); };
// Gameplay RNG
const gameRand = TEST ? mulberry32((BASE_SEED || 1987) * 31 + 7) : Math.random;
const grnd = (a = 0, b = 1) => a + (b - a) * gameRand();
const newSeed = () => (TEST ? ((BASE_SEED || 1987) + (newSeed.n = (newSeed.n || 0) + 1) * 7919) : ((Math.random() * 0x7fffffff) | 0));

function gauss(r = Math.random) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * r()); }
// Exact discretisation of an Ornstein-Uhlenbeck process (stationary std = sigma)
class OU {
  constructor(tau, sigma, r) { this.tau = tau; this.sigma = sigma; this.r = r || gameRand; this.x = 0; }
  step(dt) { const a = Math.exp(-dt / this.tau); this.x = this.x * a + this.sigma * Math.sqrt(Math.max(0, 1 - a * a)) * gauss(this.r); return this.x; }
  reset(v = 0) { this.x = v; }
}
const Store = {
  get(k, d) { try { const v = localStorage.getItem('xacto.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('xacto.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

// Shared uniforms (referenced by every thermal material)
const U = {
  uTime: { value: 0 },
  uCam: { value: new THREE.Vector3() },
  uFogD: { value: 0.00036 },
  uHaze: { value: 0.30 },
};

// City grid layout (metres). Main avenue runs along -Z from the player.
const GRID = { aveSp: 150, mainHW: 18, aveHW: 11, stSp: 95, stHW: 8, sw: 5, nAve: 7, nSt: 34 };
// .50 BMG-ish ballistics: quadratic drag dv/dt = -k|v|v
const PHYS = { g: 9.81, v0: 880, k: 3.0e-4 };
const PLAYER = { eye: new THREE.Vector3(0, 71.35, 14.6), roofY: 70 };
const UP = new THREE.Vector3(0, 1, 0);

// ==== 01_audio.js ====
// ---------------------------------------------------------------------------
// Sfx: fully synthesised WebAudio sound (no assets)
//   graph:  sources -> buses (report / sfx / ui / amb / flight) -> sum -> HP 24 Hz
//           -> compressor -> master -> soft clipper -> out
//   city reverb: convolver with a generated "street canyon" impulse response
//   (discrete slap-back echoes off buildings, duller with distance, plus a
//   rolling diffuse tail). Arcade sounds run on a 60 Hz "sound driver": pitch
//   and volume change in frame steps on pulse / triangle / noise voices.
// The context is created and resumed on the first key / click / touch
// (Sfx.init is called from those handlers), so browser autoplay rules hold.
// Sfx.renderOffline(name, args, seconds, events) renders any sound through the
// same graph into an OfflineAudioContext (used by the audio probe).
// ---------------------------------------------------------------------------
const Sfx = (() => {
  let ctx = null, A = null, flight = null, amb = null, sirenTimer = 0;
  let muted = Store.get('muted', false);
  const MASTER = 0.8;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = (a = 0, b = 1) => a + (b - a) * Math.random();

  // ---- graph ----------------------------------------------------------------------
  function makeGraph(c) {
    const g = { c };
    const sr = c.sampleRate;
    // noise tables (white, and brown for distant rumble)
    g.white = c.createBuffer(1, sr * 2, sr);
    { const d = g.white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    g.brown = c.createBuffer(1, sr * 4, sr);
    { const d = g.brown.getChannelData(0); let y = 0; for (let i = 0; i < d.length; i++) { y = (y + 0.02 * (Math.random() * 2 - 1)) * 0.997; d[i] = y * 3.5; } }
    // supersonic N-wave (2.2 ms) used for cracks
    { const L = Math.round(sr * 0.0022), b = c.createBuffer(1, L + 64, sr), d = b.getChannelData(0);
      for (let i = 0; i < L; i++) d[i + 4] = 1 - 2 * i / L; g.nwave = b; }
    // pulse waves (12.5 %, 25 %, 50 %) for the chip voices
    g.wave = {};
    for (const [k, duty] of [['p12', 0.125], ['p25', 0.25], ['p50', 0.5]]) {
      const N = 48, re = new Float32Array(N), im = new Float32Array(N);
      for (let n = 1; n < N; n++) { re[n] = (2 / (n * Math.PI)) * Math.sin(2 * Math.PI * n * duty); im[n] = (2 / (n * Math.PI)) * (1 - Math.cos(2 * Math.PI * n * duty)); }
      g.wave[k] = c.createPeriodicWave(re, im);
    }
    g.sum = c.createGain();
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 24; hp.Q.value = 0.6;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.22;
    g.master = c.createGain(); g.master.gain.value = muted ? 0 : MASTER;
    const clip = c.createWaveShaper(); clip.curve = softClipCurve(); clip.oversample = '2x';
    g.sum.connect(hp).connect(comp).connect(g.master).connect(clip).connect(c.destination);
    // city reverb
    g.verb = c.createConvolver(); g.verb.buffer = makeCityIR(c, 3.6);
    g.verbIn = c.createGain(); g.verbIn.gain.value = 1;
    g.verbLP = c.createBiquadFilter(); g.verbLP.type = 'lowpass'; g.verbLP.frequency.value = 9000;
    g.verbOut = c.createGain(); g.verbOut.gain.value = 0.9;
    g.verbIn.connect(g.verb).connect(g.verbLP).connect(g.verbOut).connect(g.sum);
    // buses
    g.sfx = c.createGain(); g.sfx.connect(g.sum);
    g.ui = c.createGain(); g.ui.gain.value = 0.9; g.ui.connect(g.sum);
    g.amb = c.createGain(); g.amb.gain.value = 1; g.amb.connect(g.sum);
    g.reportIn = c.createGain();
    g.reportLP = c.createBiquadFilter(); g.reportLP.type = 'lowpass'; g.reportLP.frequency.value = 18000; g.reportLP.Q.value = 0.5;
    g.report = c.createGain();
    g.reportIn.connect(g.reportLP).connect(g.report); g.report.connect(g.sum);
    g.reportSend = c.createGain(); g.reportSend.gain.value = 0.5; g.report.connect(g.reportSend).connect(g.verbIn);
    return g;
  }
  function softClipCurve() {
    const n = 2048, cv = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x); cv[i] = Math.sign(x) * (a < 0.7 ? a : 0.7 + 0.3 * Math.tanh((a - 0.7) / 0.3)); }
    return cv;
  }
  // Street-canyon impulse response: discrete slaps (each a short diffuse burst,
  // darker and wider the later it arrives) + a slow-building, rolling tail.
  function makeCityIR(c, sec) {
    const sr = c.sampleRate, len = Math.floor(sr * sec), b = c.createBuffer(2, len, sr);
    const slaps = [[0.083, 0.75, -0.7], [0.142, 0.55, 0.6], [0.231, 0.5, -0.2], [0.348, 0.42, 0.8], [0.47, 0.3, -0.6], [0.66, 0.26, 0.3], [0.91, 0.18, -0.4], [1.24, 0.13, 0.7], [1.71, 0.08, -0.5]];
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (const [t, amp, pan] of slaps) {
        const gainC = amp * (ch === 0 ? Math.min(1, 1 - pan) : Math.min(1, 1 + pan));
        const s0 = Math.floor((t + (ch ? 0.006 : 0) * pan) * sr), tau = (0.002 + t * 0.012) * sr;
        const fc = 7000 * Math.exp(-t / 0.55) + 600, a = 1 - Math.exp(-2 * Math.PI * fc / sr);
        let y = 0;
        for (let j = 0; j < tau * 6 && s0 + j < len; j++) { y += a * ((Math.random() * 2 - 1) - y); d[s0 + j] += y * gainC * Math.exp(-j / tau) * 2.2; }
      }
      let y = 0;
      for (let i = Math.floor(0.05 * sr); i < len; i++) {
        const t = i / sr, fc = 3200 * Math.exp(-t / 0.7) + 260, a = 1 - Math.exp(-2 * Math.PI * fc / sr);
        y += a * ((Math.random() * 2 - 1) - y);
        const env = (1 - Math.exp(-(t - 0.05) / 0.12)) * Math.exp(-t / 0.75) * (1 - t / sec) * (0.75 + 0.25 * Math.sin(t * 7.3 + ch * 2));
        d[i] += y * env * 0.32;
      }
    }
    return b;
  }

  function init() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC({ latencyHint: 'interactive' });
        A = makeGraph(ctx);
        // iOS unlock: play one silent frame inside the gesture
        const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); s.connect(ctx.destination); s.start(0);
        startAmbience();
        document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); });
      }
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
    } catch (e) { ctx = null; A = null; }
  }
  const now = () => ctx.currentTime;

  // ---- building blocks ----------------------------------------------------------
  function noise(t0, dur, buf, rate = 1) {
    const s = ctx.createBufferSource(); s.buffer = buf || A.white; s.loop = true; s.playbackRate.value = rate;
    s.start(t0, Math.random() * (s.buffer.duration - 0.1)); if (dur) s.stop(t0 + dur); return s;
  }
  function filt(type, f, q = 0.7) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  function gainAD(t0, peak, attack, decay, hold = 0) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + attack); if (hold) g.gain.setValueAtTime(peak, t0 + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + decay); return g;
  }
  function osc(type, f, t0, t1) { const o = ctx.createOscillator(); if (A.wave[type]) o.setPeriodicWave(A.wave[type]); else o.type = type; o.frequency.setValueAtTime(f, t0); o.start(t0); if (t1 != null) o.stop(t1); return o; }
  function panner(p) { if (!ctx.createStereoPanner) return ctx.createGain(); const s = ctx.createStereoPanner(); s.pan.value = p; return s; }
  function shaper(drive) {
    const w = ctx.createWaveShaper(), n = 1024, cv = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; cv[i] = Math.tanh(x * drive) / Math.tanh(drive); }
    w.curve = cv; return w;
  }
  // 60 Hz chip voice: frame-stepped volume envelope and pitch slide, like an 8-bit sound driver
  const FR = 1 / 60;
  function chip(t0, f, dur, wave = 'p50', vol = 0.07, o = {}) {
    const frames = Math.max(1, Math.round(dur / FR)), t1 = t0 + frames * FR;
    const v = osc(wave, f, t0, t1 + 0.03), g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
    const sustain = o.sustain == null ? 0.55 : o.sustain;
    for (let k = 0; k < frames; k++) {
      const x = k / frames, env = k === 0 ? 1 : k < 3 ? 1 - (1 - sustain) * (k / 3) : sustain * Math.pow(1 - x, o.release || 0.6);
      g.gain.setTargetAtTime(vol * env, t0 + k * FR, 0.0015);
      if (o.slide) v.frequency.setValueAtTime(f * Math.pow(o.slide, x), t0 + k * FR);
      if (o.vib && k > 4) v.frequency.setValueAtTime(f * (1 + o.vib * ((k & 2) ? 1 : -1)), t0 + k * FR);
    }
    g.gain.setTargetAtTime(0, t1, 0.003);
    v.connect(g).connect(o.bus || A.ui);
    return g;
  }
  function chipNoise(t0, dur, vol = 0.05, hp = 1000, bus) {
    const frames = Math.max(1, Math.round(dur / FR)), g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
    for (let k = 0; k < frames; k++) g.gain.setTargetAtTime(vol * Math.pow(1 - k / frames, 1.5), t0 + k * FR, 0.0015);
    g.gain.setTargetAtTime(0, t0 + frames * FR, 0.003);
    noise(t0, dur + 0.05, null, 0.5).connect(filt('highpass', hp)).connect(g).connect(bus || A.ui); return g;
  }
  // tiny sequencer: tracks of [midi|0 (rest), sixteenths]
  function seq(t0, step, tracks) {
    let end = t0;
    for (const tr of tracks) {
      let t = t0;
      for (const [m, len] of tr.notes) {
        const d = len * step;
        if (m) { if (tr.noise) chipNoise(t, Math.min(d, tr.len || 0.08), tr.vol, m); else chip(t, mtof(m), d * (tr.gate || 0.9), tr.wave, tr.vol, tr.o || {}); }
        t += d;
      }
      end = Math.max(end, t);
    }
    return end - t0;
  }

  // ---- weapon -------------------------------------------------------------------
  function crackAt(t, vol, bus) {
    const s = ctx.createBufferSource(); s.buffer = A.nwave; s.start(t);
    const g = ctx.createGain(); g.gain.value = vol; s.connect(filt('highpass', 300)).connect(g).connect(bus);
    return g;
  }
  // .50 cal report: N-wave crack + saturated muzzle blast + brake bark + chest boom; city slap-back via the reverb
  function shot() {
    if (!ctx) return; const t = now(), R = A.reportIn;
    A.reportLP.frequency.cancelScheduledValues(t); A.reportLP.frequency.setValueAtTime(18000, t);
    A.report.gain.cancelScheduledValues(t); A.report.gain.setValueAtTime(1, t);
    A.verbLP.frequency.cancelScheduledValues(t); A.verbLP.frequency.setValueAtTime(9000, t);
    crackAt(t, 0.9, R);
    // blast: white noise through a falling lowpass, driven into saturation
    const lp = filt('lowpass', 9000, 0.9);
    lp.frequency.setValueAtTime(11000, t); lp.frequency.exponentialRampToValueAtTime(2600, t + 0.03); lp.frequency.exponentialRampToValueAtTime(320, t + 0.4);
    let g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.0, t + 0.0008);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.04); g.gain.exponentialRampToValueAtTime(0.04, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    noise(t, 0.8).connect(lp).connect(shaper(2.2)).connect(g).connect(R);
    // muzzle-brake bark (harsh mid band)
    g = gainAD(t, 0.55, 0.001, 0.13); noise(t, 0.2).connect(filt('bandpass', 750, 1.4)).connect(g).connect(R);
    g = gainAD(t, 0.3, 0.001, 0.06); noise(t, 0.1).connect(filt('bandpass', 2400, 1.2)).connect(g).connect(R);
    // chest boom: falling sine + punch
    let o = osc('sine', 64, t, t + 0.9); o.frequency.exponentialRampToValueAtTime(29, t + 0.5);
    g = gainAD(t, 0.95, 0.002, 0.42); o.connect(g).connect(R);
    o = osc('triangle', 120, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(48, t + 0.18);
    g = gainAD(t, 0.45, 0.001, 0.22); o.connect(shaper(1.6)).connect(g).connect(R);
    // low rumble rolling down the avenue (brown noise, swells late)
    g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    noise(t, 2.5, A.brown).connect(filt('lowpass', 220)).connect(g).connect(R);
  }
  // Supersonic crack heard near the flight path (dist m, pan -1..1)
  function crack(dist = 10, pan = 0) {
    if (!ctx) return; const t = now(), v = Math.min(0.95, 6 / Math.max(2, dist));
    const p = panner(pan); p.connect(A.sfx); crackAt(t, v, p);
    const g = gainAD(t, v * 0.5, 0.0005, 0.05); noise(t, 0.08).connect(filt('highpass', 3000)).connect(g).connect(p); g.connect(A.verbIn);
  }

  // ---- arcade / UI -------------------------------------------------------------------
  function blip(freq = 880, dur = 0.06, type = 'square', vol = 0.08, when = 0) {
    if (!ctx) return; const w = type === 'square' ? 'p50' : type;
    chip(now() + when, freq, Math.max(FR * 2, dur), w, vol * 0.9, { sustain: 0.7 });
  }
  function arp(notes, step = 0.07, type = 'square', vol = 0.07) { notes.forEach((f, i) => blip(f, step * 1.2, type, vol, i * step)); }
  function coin() { // credit in: stepped upward run on a thin pulse, ends with a sparkle
    if (!ctx) return; const t = now();
    [72, 76, 79, 84, 88, 91].forEach((m, i) => chip(t + i * 0.035, mtof(m), 0.05, 'p25', 0.08, { sustain: 0.8 }));
    chip(t + 0.21, mtof(96), 0.3, 'p12', 0.07, { sustain: 0.7, vib: 0.012, release: 1.2 });
  }
  function tick() { if (!ctx) return; chip(now(), 1976, FR * 2, 'p25', 0.18, { sustain: 0.9 }); }
  function lock() { if (!ctx) return; const t = now(); chip(t, 1319, 0.05, 'triangle', 0.16, { sustain: 0.9 }); chip(t + 0.05, 1760, 0.08, 'triangle', 0.14, { sustain: 0.8 }); }
  function deny() { if (!ctx) return; const t = now(); chip(t, 110, 0.09, 'p25', 0.08, { sustain: 1 }); chip(t + 0.12, 104, 0.16, 'p25', 0.08, { sustain: 1, slide: 0.85 }); }
  // stage start: bugle-call motif over a marching bass and snare
  function stageStart() {
    if (!ctx) return 0; const t = now() + 0.02, s = 0.075;
    return seq(t, s, [
      { wave: 'p25', vol: 0.06, notes: [[67, 2], [72, 2], [76, 2], [79, 4], [76, 2], [79, 8]], o: { sustain: 0.6, vib: 0.006 } },
      { wave: 'p12', vol: 0.025, notes: [[0, 1], [67, 2], [72, 2], [76, 2], [79, 4], [76, 2], [79, 7]], o: { sustain: 0.5 } },
      { wave: 'triangle', vol: 0.16, notes: [[48, 4], [43, 4], [48, 4], [43, 2], [48, 6]], gate: 0.8, o: { sustain: 0.9 } },
      { noise: true, vol: 0.05, len: 0.05, notes: [[3000, 1], [3000, 1], [3000, 2], [3000, 4], [3000, 4], [3000, 2], [3000, 6]] },
    ]);
  }
  // target down fanfare
  function fanfare(t) {
    seq(t, 0.06, [
      { wave: 'p25', vol: 0.06, notes: [[72, 1], [76, 1], [79, 1], [84, 2], [79, 1], [84, 6]], o: { sustain: 0.65, vib: 0.008 } },
      { wave: 'triangle', vol: 0.15, notes: [[48, 2], [55, 2], [60, 2], [48, 6]], gate: 0.85, o: { sustain: 0.9 } },
    ]);
  }
  function gameOver() {
    if (!ctx) return 0; const t = now() + 0.02;
    return seq(t, 0.11, [
      { wave: 'p50', vol: 0.055, notes: [[76, 2], [74, 2], [72, 2], [71, 2], [69, 6], [0, 1], [64, 2], [69, 8]], o: { sustain: 0.6, vib: 0.01, release: 0.9 } },
      { wave: 'triangle', vol: 0.15, notes: [[45, 4], [43, 4], [41, 4], [40, 4], [45, 8]], gate: 0.9, o: { sustain: 0.85 } },
    ]);
  }
  function bonus() { if (!ctx) return; const t = now(); [84, 88, 91, 96].forEach((m, i) => chip(t + i * 0.04, mtof(m), 0.06, 'p12', 0.05, { sustain: 0.8 })); }

  // ---- results / impacts ---------------------------------------------------------------
  function hit() {
    if (!ctx) return; const t = now();
    // fabric / dust thwump (no gore): soft low noise + body thump

// ---------------------------------------------------------------------------
// Thermal materials. Every scene material writes:
//   R = apparent temperature (0 cold sky .. 1 hot skin)
//   G = facet code (normal-derived; used for vector edge lines in post)
//   B = log depth (for edge lines + fog)
// ---------------------------------------------------------------------------
const GLSL_LIB = /* glsl */`
uniform float uTime; uniform vec3 uCam; uniform float uFogD; uniform float uHaze;
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash31(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), u.x), mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), u.x), u.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; } return s; }
float fbm2(vec2 p){ return 0.667*vnoise(p) + 0.333*vnoise(p*2.03 + 17.1); }
// box-filtered periodic pulse (anti-aliased procedural stripes)
float pint(float x, float a, float b){ return floor(x)*(b-a) + clamp(fract(x), a, b) - a; }
float fpulse(float x, float a, float b, float w){ w = max(w, 1e-4); return clamp((pint(x+0.5*w,a,b) - pint(x-0.5*w,a,b))/w, 0.0, 1.0); }
float band(float x, float c, float hw){ float fw = max(fwidth(x), 1e-4); return clamp((hw - abs(x - c))/fw + 0.5, 0.0, 1.0) * min(1.0, 2.0*hw/fw); }
float sstep(float a, float b, float x){ return smoothstep(a, b, x); }
float fogF(vec3 wp){ return 1.0 - exp(-length(wp - uCam) * uFogD); }
vec4 thermalOut(float t, vec3 wp, vec3 n){
  vec3 V = normalize(uCam - wp);
  t *= 0.88 + 0.12*abs(dot(V, n));               // emissivity falls off at grazing angles
  t = mix(t, uHaze + 0.025, fogF(wp));              // city haze sits a touch above the horizon sky

`;

const VS_STD = /* glsl */`
attribute float aSeed; attribute float aStyle;
varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vS; varying float vSeed; varying float vStyle; varying float vTop;
void main(){
  mat4 m = modelMatrix;
  #ifdef USE_INSTANCING
  m = m * instanceMatrix;
  #endif
  vec4 wp = m * vec4(position, 1.0);
  vW = wp.xyz; vL = position;
  vS = vec3(length(m[0].xyz), length(m[1].xyz), length(m[2].xyz));
  vN = normalize(mat3(m) * (normal / max(vS*vS, vec3(1e-6))));

  vTop = (m * vec4(0.0, 1.0, 0.0, 1.0)).y;

// Parapet ring: one instance per roof. Inner-wall vertices (aIn = 1) are pulled in
// by a fixed wall thickness in metres, independent of the instance's xz scale.
const VS_RING = /* glsl */`
attribute float aSeed; attribute float aStyle; attribute float aIn;
uniform float uRingT;
varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vS; varying float vSeed; varying float vStyle; varying float vTop;
void main(){
  mat4 m = modelMatrix;
  #ifdef USE_INSTANCING
  m = m * instanceMatrix;
  #endif

const VARY = 'varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vS; varying float vSeed; varying float vStyle; varying float vTop;\n';

function thermalMat(frag, extra = {}, opts = {}) {
  return new THREE.ShaderMaterial(Object.assign({
    uniforms: Object.assign({}, U, extra),

    t = 0.235;
    if (n.y > 0.5) {
      vec2 q = vL.xz * vS.xz; float R = 0.42*min(vS.x, vS.z);
      float r = length(q);
      float ring = band(r, R, 0.32);
      vec2 h = abs(q) / R;
      float H = (step(h.x, 0.42) * step(h.y, 0.55)) * max(step(0.28, h.x), step(h.y, 0.07));
      t = mix(t, 0.31, max(ring, H));
    }
  } else if (st >= 3 && st <= 5) {
    // plain structural elements: parapets, bulkheads, masts, bridges
    t = (st == 4 ? 0.40 : base - 0.012) + 0.02*(vnoise(vW.xz*0.5 + vW.y*0.3) - 0.5);
    if (n.y > 0.5) t = st == 4 ? 0.30 : 0.235;
    if (st == 4 && abs(n.y) < 0.5) {
      // lit sign panel: lamps along the top edge heat the face, cools downward
      float yy = (vW.y - (vTop - vS.y)) / max(vS.y, 1e-3);
      t = 0.36 + 0.16*yy*yy + 0.05*fpulse(vW.x*0.25 + vW.z*0.25, 0.0, 0.5, fwidth(vW.x*0.25 + vW.z*0.25));
    }
    if (st == 5) { // skybridge: glazed band
      float yy = (vW.y - (vTop - vS.y));
      float g = band(yy, vS.y*0.5, vS.y*0.28);
      float lit = step(0.5, hash21(vec2(floor((vW.x+vW.z)/3.0), seed*40.0)));
      t = mix(0.37, mix(0.25, 0.5, lit), g * step(abs(n.y), 0.5));
      if (n.y > 0.5) t = 0.25;
    }
  } else if (n.y > 0.5) {
    // roofs radiate to the cold sky: coldest surfaces in the city
    float g = fbm2(vW.xz*0.13 + seed*31.0);
    t = 0.205 + 0.03*(g - 0.5) + 0.02*(seed - 0.5);
    vec2 sc = vW.xz / vec2(2.4, 7.0);
    t += 0.010*fpulse(sc.x, 0.0, 0.08, fwidth(sc.x));
  } else if (n.y < -0.5) {
    t = base + 0.02;
  } else {
    bool xFace = abs(n.x) > 0.5;
    float faceW = xFace ? vS.z : vS.x;
    float u = ((xFace ? vL.z : vL.x) + 0.5) * faceW;
    float colW = st == 0 ? 1.9 : st == 1 ? 3.3 : st == 7 ? 6.0 : st == 10 ? 2.6 : 3.0;
    float flH  = st == 0 ? 3.9 : st == 1 ? 3.1 : st == 7 ? 6.5 : st == 10 ? 3.6 : 4.2;
    float corner = st == 0 ? 0.7 : 1.5;
    float usable = max(faceW - 2.0*corner, 0.5);
    float N = max(1.0, floor(usable/colW + 0.5));
    float cx = (u - corner) / usable * N;
    float gf = 5.0;
    float cy = (vW.y - gf) / flH;
    vec2 fw = max(fwidth(vec2(cx, cy)), vec2(1e-4));
    float fwy = max(fwidth(vW.y), 1e-4);
    float mx = st == 0 ? 0.07 : st == 1 ? 0.30 : st == 2 ? 0.05 : st == 10 ? 0.30 : 0.38;
    float my0 = st == 0 ? 0.10 : st == 2 ? 0.38 : st == 7 ? 0.70 : 0.30;
    float my1 = st == 0 ? 0.90 : st == 2 ? 0.80 : st == 7 ? 0.88 : 0.80;
    float wx = fpulse(cx, mx, 1.0 - mx, fw.x);
    float wy = fpulse(cy, my0, my1, fw.y);
    float inC = clamp(cx/fw.x + 0.5, 0.0, 1.0) * clamp((N - cx)/fw.x + 0.5, 0.0, 1.0);
    float inR = clamp(cy/fw.y + 0.5, 0.0, 1.0) * clamp((vTop - 1.6 - vW.y)/fwy + 0.5, 0.0, 1.0);
    vec2 id = floor(vec2(cx, cy));
    float faceId = xFace ? (n.x > 0.0 ? 1.0 : 2.0) : (n.z > 0.0 ? 3.0 : 4.0);
    float suite = hash31(vec3(floor(id.x/3.0), id.y, seed*113.0 + faceId));
    float h = hash31(vec3(id, seed*71.0 + faceId*13.0));
    float litFrac = (st == 7 ? 0.05 : 0.10) + 0.28*fract(seed*7.31);
    float lit = step(1.0 - litFrac, suite*0.75 + h*0.25);
    float glass = 0.222 + 0.02*h;                   // glass mirrors the cold sky
    float warm = 0.47 + 0.15*h;                      // occupied, heated rooms
    float wT = mix(glass, warm, lit);
    // window LOD: once a window cell is near a pixel, fade to the face's mean temperature
    float lod = sstep(0.25, 0.9, max(fw.x, fw.y));
    float win = wx*wy*inC*inR;
    float meanWin = mix(glass, 0.54, litFrac*0.8);
    float c = fract((my1 + my0 + 1.0)*0.5);
    float slab = fpulse(cy, c - 0.05, c + 0.05, fw.y) * inR;
    t = base + 0.03*slab;
    if (st == 0) {
      // curtain wall: spandrel panels are warmer than the vision glass, mullions are thermal bridges
      t = base + 0.02*slab + 0.025*fpulse(cx, -0.04, 0.04, fw.x)*inR;
    } else if (st == 7) {
      // corrugated metal: low emissivity, vertical ribs
      float rib = vW.x*1.6 + vW.z*1.6;
      t = base + 0.018*fpulse(rib, 0.0, 0.5, fwidth(rib)) * (1.0 - lod);
    } else if (st == 10) {
      // art-deco pilasters between the window stacks
      t = base + 0.025*(1.0 - fpulse(cx, 0.18, 0.82, fw.x));
    }
    float wMean = mix(t, meanWin, (1.0 - 2.0*mx) * (my1 - my0));
    t = mix(mix(t, wT, win), wMean, lod);
    // AC units hanging under some residential windows
    if (st == 1) {
      float ac = step(0.93, hash31(vec3(id, seed*5.0 + faceId))) * fpulse(cx, 0.35, 0.65, fw.x) * fpulse(cy, 0.12, 0.27, fw.y) * inR * inC;
      t = mix(t, 0.62, ac * (1.0 - lod));
    }
    // street level: storefronts, or loading docks on sheds
    float sf = clamp((vW.y - 0.6)/fwy + 0.5, 0.0, 1.0) * clamp(((st == 7 ? 5.0 : 4.1) - vW.y)/fwy + 0.5, 0.0, 1.0);
    float shop = hash31(vec3(floor(u/6.0), seed*7.0, faceId));
    float sfT = st == 7 ? mix(0.28, 0.52, step(0.75, shop)) : 0.37 + 0.17*shop;
    t = mix(t, sfT, sf * step(0.3, shop) * fpulse(u/6.0, 0.08, 0.92, fwidth(u/6.0)));
    t += 0.016*n.x - 0.008*n.z;
    t += 0.03*(1.0 - sstep(0.0, 14.0, vW.y));
  }
  gl_FragColor = thermalOut(t, vW, n);
}`;

// Open steel lattice (masts, crane trusses, scaffolding, bridge trusses). Uses discard,
// so it lives in its own draw call.
const FS_LATTICE = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  bool xF = abs(n.x) > 0.5; bool yF = abs(n.y) > 0.5;
  float fwid = yF ? vS.x : (xF ? vS.z : vS.x);
  float u = yF ? (vL.x + 0.5)*vS.x : ((xF ? vL.z : vL.x) + 0.5)*fwid;
  float v = yF ? (vL.z + 0.5)*vS.z : vL.y*vS.y;
  float cell = yF ? min(vS.x, vS.z) : min(fwid, vS.y);
  cell = min(cell, 2.6);
  vec2 q = vec2(u, v)/cell; vec2 f = fract(q);
  float lw = 0.085;
  float edge = max(max(step(f.x, lw), step(1.0-lw, f.x)), max(step(f.y, lw), step(1.0-lw, f.y)));
  float br = max(step(abs(f.x - f.y), lw), step(abs(f.x + f.y - 1.0), lw));
  float px = max(fwidth(q.x), fwidth(q.y));
  if (max(edge, br) < 0.5 && px < 0.22) discard;
  float t = 0.30 + 0.03*(vSeed - 0.5) + 0.04*float(int(vStyle + 0.5) == 4);
  gl_FragColor = thermalOut(t, vW, n);
}`;

// HVAC units: warm casings, hot fan discs on top
const FS_HVAC = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  float t = 0.46 + 0.08*(vSeed - 0.5);
  if (n.y > 0.5) {
    vec2 c = vL.xz * vS.xz;
    float along = vS.x > vS.z ? c.x : c.y;
    float across = vS.x > vS.z ? c.y : c.x;
    float L = max(vS.x, vS.z), r = min(vS.x, vS.z)*0.36;
    float k = floor(L / (2.6*r)); k = max(k, 1.0);
    float cell = L / k;
    float lc = mod(along + 0.5*L, cell) - 0.5*cell;
    float d = length(vec2(lc, across));
    float fw = max(fwidth(d), 1e-4);
    float disc = clamp((r - d)/fw + 0.5, 0.0, 1.0);
    float hub = clamp((r*0.25 - d)/fw + 0.5, 0.0, 1.0);
    float lod = sstep(0.15, 0.6, fw/max(r, 1e-3));
    t = mix(0.42, 0.80 + 0.1*vSeed, mix(disc, 0.4, lod));
    t = mix(t, 0.55, hub*(1.0 - lod));
  } else {
    float y = vL.y * vS.y;
    t += 0.05*fpulse(y*5.0, 0.0, 0.45, fwidth(y*5.0));
  }
  gl_FragColor = thermalOut(t, vW, n);
}`;

// Generic low-poly solid with flat facets (tanks, cones, cranes, figure parts)
const FS_SOLID = /* glsl */`
uniform float uT; uniform float uStripe;
void main(){
  vec3 n = flatN(vW);
  float t = uT + 0.05*(vSeed - 0.5);
  if (uStripe > 0.0) {
    float a = atan(vL.z, vL.x) * 12.0 / 3.14159;
    t += 0.018*fpulse(a, 0.0, 0.18, fwidth(a));
    float y = vL.y * vS.y;
    t += 0.03*fpulse(y/1.6, 0.0, 0.08, fwidth(y/1.6));
    t -= 0.035*(1.0 - vL.y);
  }
  gl_FragColor = thermalOut(t, vW, n);
}`;

// Faceted shapes with per-face temperature: sloped faces radiate to the sky (cold),
// vertical faces read as glazing (sawtooth north lights) or warm stone (crowns).
//   uKind 0: pyramid / crown cap   1: sawtooth roof   2: cooling tower shell   3: dish
const FS_SHAPE = /* glsl */`
uniform float uT; uniform float uKind;
void main(){
  vec3 n = flatN(vW);
  int k = int(uKind + 0.5);
  float t = uT + 0.05*(vSeed - 0.5);
  if (k == 1) {
    if (abs(n.y) < 0.3) {
      float y = vL.y;
      float g = fpulse(vW.x/1.5 + vW.z/1.5, 0.08, 0.92, fwidth(vW.x/1.5 + vW.z/1.5));
      float lit = step(0.72, hash21(vec2(floor((vW.x + vW.z)/12.0), vSeed*31.0)));
      t = mix(0.30, mix(0.235, 0.46, lit), g * step(0.12, y) * step(y, 0.9));
    } else t = 0.215 + 0.012*fpulse(vW.x/0.9 + vW.z/0.9, 0.0, 0.4, fwidth(vW.x/0.9 + vW.z/0.9));
  } else if (k == 2) {
    // hyperboloid cooling tower: warm, hottest near the lip (exhaust heats the shell)
    t = uT + 0.10*vL.y*vL.y + 0.02*(vSeed - 0.5);
    float y = vW.y / 2.2;
    t += 0.012*fpulse(y, 0.0, 0.12, fwidth(y));
    if (!gl_FrontFacing) t = 0.62 + 0.15*vL.y;
  } else if (k == 3) {
    t = gl_FrontFacing ? uT : uT + 0.06;
  } else {
    t += (n.y > 0.35 ? -0.03 : 0.02) + 0.015*fpulse(vW.y/2.0, 0.0, 0.15, fwidth(vW.y/2.0));
  }
  gl_FragColor = thermalOut(t, vW, n);
}`;

// Cars: hot engine bay & exhaust, cold glass
const FS_CAR = /* glsl */`
void main(){
  vec3 n = normalize(vN);
  vec3 l = vL;
  float t = 0.40 + 0.05*(vSeed - 0.5);
  if (l.y > 1.06) t = (n.y > 0.5) ? 0.35 : 0.27;
  if (l.z > 0.9 && l.y > 0.3 && l.y <= 1.06) t = mix(t, 0.74, sstep(0.9, 2.0, l.z));
  if (l.z > 2.1 && n.z > 0.5) t = 0.86;
  if (n.z < -0.5 && l.y < 0.62 && abs(l.x - 0.5) < 0.22) t = 0.95;
  if (l.y < 0.68 && abs(l.x) > 0.8) t = 0.6;
  gl_FragColor = thermalOut(t, vW, n);
}`;

// Ground: roads, sidewalks, markings, manholes, river, parks
const FS_GROUND = /* glsl */`
uniform vec4 uGrid; uniform vec2 uGrid2; uniform vec4 uRiver; uniform vec4 uPark0; uniform vec4 uPark1;
float inRect(vec2 p, vec4 r){ return step(r.x, p.x) * step(p.x, r.z) * step(r.y, p.y) * step(p.y, r.w); }
void main(){
  vec2 p = vW.xz;
  float aveSp = uGrid.x, mainHW = uGrid.y, aveHW = uGrid.z, stSp = uGrid.w, stHW = uGrid2.x, sw = uGrid2.y;
  float ai = floor(p.x/aveSp + 0.5);
  float ax = p.x - ai*aveSp; float adx = abs(ax);
  bool isMain = abs(ai) < 0.5;
  float hwA = isMain ? mainHW : aveHW;
  float noAve = (isMain && p.y > stHW) ? 1.0 : 0.0;
  float si = floor(-p.y/stSp + 0.5);
  float sz = p.y + si*stSp; float sdz = abs(sz);
  float onA = (1.0 - noAve) * (1.0 - step(hwA, adx));
  float onS = (1.0 - step(stHW, sdz)) * step(p.y, stHW + 1.0) ;
  float road = max(onA, onS);
  float walkA = (1.0 - noAve) * (1.0 - step(hwA + sw, adx));
  float walk = max(walkA, (1.0 - step(stHW + sw, sdz)) * step(p.y, stHW + sw + 1.0)) * (1.0 - road);
  float n1 = fbm2(p*0.06);
  float t = 0.30 + 0.02*(n1 - 0.5);
  float water = uRiver.z * step(uRiver.x, p.y) * step(p.y, uRiver.y) * (1.0 - step(adx, hwA + sw));
  float park = max(inRect(p, uPark0), inRect(p, uPark1)) * (1.0 - walk) * (1.0 - road);
  if (water > 0.5) {
    // river: warmer than the night air, but a near-mirror for the cold sky at grazing angles
    vec3 V = normalize(uCam - vW);
    float fr = 0.03 + 0.97*pow(1.0 - clamp(V.y, 0.0, 1.0), 5.0);
    vec2 wp = vec2(p.x*0.05 + uTime*0.04, p.y*0.6);
    float rip = vnoise(wp) * vnoise(wp*2.7 + 3.1);
    t = mix(0.37 + 0.02*rip, 0.13 + 0.10*rip, fr*0.9);
  } else if (park > 0.5) {
    // grass radiates to the sky: colder than paving; gravel paths a touch warmer
    t = 0.255 + 0.025*(fbm2(p*0.35) - 0.5);
    float d1 = abs(fract((p.x + p.y)/38.0) - 0.5)*38.0, d2 = abs(fract((p.x - p.y)/38.0) - 0.5)*38.0;
    float path = max(band(d1, 0.0, 1.1), band(d2, 0.0, 1.1));
    t = mix(t, 0.30, path);
  } else if (road > 0.5) {
    t = 0.392 + 0.035*(n1 - 0.5) + 0.012*(vnoise(p*1.1) - 0.5);
    float paint = 0.0;
    if (onA > 0.5 && onS < 0.5) {
      paint += band(adx, 0.22, 0.07);
      float lane = adx / 3.4;
      float dash = fpulse(p.y/9.0, 0.0, 0.35, fwidth(p.y/9.0));
      for (int k = 1; k <= 4; k++) { if (float(k)*3.4 < hwA - 1.0) paint += band(adx, float(k)*3.4, 0.07) * dash; }
      float cw = step(stHW + 0.8, sdz) * step(sdz, stHW + 4.6);
      paint += cw * fpulse(ax/1.1, 0.0, 0.5, fwidth(ax/1.1));
      paint += band(sdz, stHW + 5.2, 0.2) * step(0.0, ax * sign(sz + 0.001));
      // tyre tracks are warmer
      t += 0.014*(0.5 + 0.5*cos(6.2832*(lane - 0.5)));
      // manholes
      vec2 mh = vec2(mod(ax + 1.7, 3.4) - 1.7, mod(p.y, 41.0) - 20.5);
      float md = length(mh);
      t = mix(t, 0.56, clamp((0.42 - md)/max(fwidth(md),1e-4) + 0.5, 0.0, 1.0) * step(0.7, hash21(floor(vec2(ax/3.4, p.y/41.0)))));
    } else if (onS > 0.5 && onA < 0.5) {
      paint += band(sdz, 0.15, 0.06) * fpulse(p.x/7.0, 0.0, 0.4, fwidth(p.x/7.0));
    }
    t -= 0.04*clamp(paint, 0.0, 1.0);
  } else if (walk > 0.5) {
    t = 0.325 + 0.012*(n1 - 0.5);
    vec2 g = p/1.6; vec2 fw = fwidth(g);
    t -= 0.012*max(fpulse(g.x, 0.0, 0.05, fw.x), fpulse(g.y, 0.0, 0.05, fw.y));
    float curbA = band(adx, hwA + 0.15, 0.15) * (1.0 - noAve);
    t += 0.03*curbA;
  }
  gl_FragColor = thermalOut(t, vW, vec3(0.0, 1.0, 0.0));
}`;

const FS_SKY = /* glsl */`
void main(){
  vec3 d = normalize(vW - uCam);
  float h = d.y;
  float t = mix(uHaze, 0.045, pow(clamp(h, 0.0, 1.0), 0.42));
  if (h > 0.0) {
    vec2 cp = d.xz / (h + 0.06) * 1.4 + vec2(uTime*0.003, uTime*0.001);
    float c = smoothstep(0.48, 0.85, fbm(cp));
    t += c * 0.075 * (1.0 - smoothstep(0.0, 0.7, h));
  } else t = uHaze;
  gl_FragColor = vec4(t, 0.5, 1.0, 1.0);
}`;

// Point lights (aviation beacons, lamp heads) – always at least a few pixels wide
const LightPoints = (() => {
  const VS = /* glsl */`
  uniform float uTime; uniform float uScale; uniform vec3 uCam; uniform float uFogD; uniform float uHaze;
  attribute float aPhase; attribute float aKind; attribute float aSize;
  varying float vHeat;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    float d = -mv.z;
    float blink = aKind < 0.5 ? step(fract(uTime*0.5 + aPhase), 0.14) : 1.0;
    float heat = aKind < 0.5 ? mix(0.0, 0.85, blink) : 0.55;
    float f = 1.0 - exp(-d * uFogD * 0.8);
    vHeat = heat * (1.0 - f);
    gl_PointSize = clamp(aSize * uScale / d, 2.2, 48.0);
    gl_Position = projectionMatrix * mv;
  }`;
  const FS = /* glsl */`
  varying float vHeat;
  void main(){
    vec2 c = gl_PointCoord - 0.5; float r = length(c)*2.0;
    float a = exp(-r*r*5.0);
    if (r > 1.0) discard;
    gl_FragColor = vec4(vHeat * a, 0.0, 0.0, 1.0);
  }`;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uCam: U.uCam, uFogD: U.uFogD, uHaze: U.uHaze, uScale: { value: 500 } },
    vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  return { mat };
})();

// ==== 03_city.js ====
// ---------------------------------------------------------------------------
// City: procedural low-poly city, regenerated from a seed every stage.
// Provides collision (AABB grid), raycasts, rooftops for target spawns,
// heat emitters, traffic.
//
// Every seed rolls a "sector profile" (skyline height, tower archetypes, river,
// parks, industrial quarter, obstacle mix over the main avenue), so each stage
// reads as a different part of town. Detail is spent where the scope and the
// bullet can see it: lots inside the firing sector get full roof clutter and
// parapets, lots outside it are plain massing.
// ---------------------------------------------------------------------------
const City = (() => {
  const CELL = 32;
  const group = new THREE.Group();

  // ---- geometry ------------------------------------------------------------
  function polyGeo(polys) {
    // polys: [{ p: [[x,y,z]...3|4], n: [x,y,z], f: [flags] }] -> non-indexed, flat normals, winding fixed to n
    const P = [], N = [], F = [];
    for (const q of polys) {
      const [a, b, c] = q.p;
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      const flip = (uy * vz - uz * vy) * q.n[0] + (uz * vx - ux * vz) * q.n[1] + (ux * vy - uy * vx) * q.n[2] < 0;
      const ord = q.p.length === 4 ? (flip ? [0, 2, 1, 0, 3, 2] : [0, 1, 2, 0, 2, 3]) : (flip ? [0, 2, 1] : [0, 1, 2]);
      for (const i of ord) { P.push(...q.p[i]); N.push(...q.n); F.push(q.f ? q.f[i] : 0); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
    g.setAttribute('aIn', new THREE.Float32BufferAttribute(F, 1));
    return g;
  }
  function mergeNI(gs) {
    const P = [], N = [];
    for (const g0 of gs) { const g = g0.index ? g0.toNonIndexed() : g0; P.push(...g.attributes.position.array); N.push(...g.attributes.normal.array); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
    return g;
  }
  function ringGeo() {
    // parapet ring: outer walls, inner walls (aIn=1, pulled in by VS_RING), top frame
    const o = 0.5, i = 0.4, polys = [];
    const sides = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [sx, sz] of sides) {

//   display pass at fixed display resolution (palette, AGC, edges, noise, bloom,
//   scope optics with iris / zoom blur, HUD composite + glow, scanlines, curvature)

  out.ang = Math.atan2((inFront ? 1 : -1) * ndc.y / camera.aspect, (inFront ? 1 : -1) * ndc.x);
  const d = p.distanceTo(camera.position);
  out.h = 1.8 / (2 * d * Math.tan((camera.fov * DEG) / 2));
  return out;
}
const pip = new THREE.Vector3();

// ---- update ------------------------------------------------------------------
function updateAim(rdt) {
  const fovR = (40 / G.mag) * DEG;
  const sens = fovR / Math.max(300, innerHeight) * 0.9;
  Aim.yaw -= Input.dx * sens; Aim.pitch -= Input.dy * sens;
  const kr = fovR * 0.55 * rdt;
  if (held('ArrowLeft', 'KeyA')) Aim.yaw += kr; if (held('ArrowRight', 'KeyD')) Aim.yaw -= kr;
  if (held('ArrowUp', 'KeyW')) Aim.pitch += kr; if (held('ArrowDown', 'KeyS')) Aim.pitch -= kr;
  // edge panning when the pointer isn't locked
  if (document.pointerLockElement !== canvas && Input.inside && !Input.touchAim) {
    const ex = Input.mx < 0.04 ? -1 : Input.mx > 0.96 ? 1 : 0, ey = Input.my < 0.05 ? -1 : Input.my > 0.95 ? 1 : 0;
    Aim.yaw -= ex * fovR * 0.5 * rdt; Aim.pitch -= ey * fovR * 0.5 * rdt;
  }
  Aim.yaw = clamp(Aim.yaw, -1.0, 1.0); Aim.pitch = clamp(Aim.pitch, -0.45, 0.2);
  if (Input.wheel || pressed('KeyE', 'KeyQ', 'KeyZ', 'KeyX')) {
    const d = Input.wheel !== 0 ? -Math.sign(Input.wheel) : pressed('KeyE', 'KeyX') ? 1 : -1;
    const ni = clamp(G.magI + d, 0, MAGS.length - 1); if (ni !== G.magI) { G.magI = ni; Sfx.blip(600 + ni * 120, 0.03, 'square', 0.04); }
  }
  G.mag = damp(G.mag, MAGS[G.magI], 10, rdt);
  // breath
  const wantHold = held('ShiftLeft', 'ShiftRight') && G.gasp <= 0 && G.breath > 0;
  G.holding = wantHold;
  if (G.holding) { G.breath -= rdt / 6; Aim.hbT -= rdt; if (Aim.hbT < 0) { Aim.hbT = 0.75; Sfx.heartbeat(0.8); } if (G.breath <= 0) { G.breath = 0; G.gasp = 2.5; G.holding = false; } }
  else { G.breath = Math.min(1, G.breath + rdt / 4.5); }
  if (G.gasp > 0) G.gasp -= rdt;
  aimCamera(rdt);
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
  G.lased = lase(PLAYER.eye, fwd);
  rightV.crossVectors(fwd, UP).normalize();
  G.crossWind = G.wind.dot(rightV);
}

function tick(rdt) {
  U.uTime.value += rdt;
  G.toastT -= rdt; G.flash = Math.max(0, G.flash - rdt * 4); G.staticAmt = Math.max(0, G.staticAmt - rdt * 5);
  if (pressed('KeyP', 'Escape') && G.state !== 'attract') G.paused = !G.paused;
  if (pressed('KeyT')) { G.mode = (G.mode + 1) % MODES.length; G.modeName = MODES[G.mode].name; Store.set('mode', G.mode); toast(`SENSOR ${G.modeName}`); Sfx.blip(1100, 0.04); }
  if (pressed('KeyM')) toast(Sfx.toggleMute() ? 'SOUND OFF' : 'SOUND ON');
  if (G.paused) {
    // click / tap / space also resumes (and is swallowed, so it never fires a round)
    if (pressed('Fire', 'Space', 'Enter')) G.paused = false;
    Input.pressed.clear(); Input.dx = Input.dy = Input.wheel = 0; return;
  }
  G.stateT += rdt;
  G.scoreShown = G.scoreShown < G.score ? Math.min(G.score, G.scoreShown + Math.max(37, (G.score - G.scoreShown) * 4 * rdt)) : G.score;
  let gdt = rdt;
  const fire_ = pressed('Space', 'Enter', 'Fire');
  // attract-mode demo: any key or click hands the game to the player
  if (G.demo) {
    if (fire_ && G.state !== 'attract') { endDemo(); startGame(); Input.pressed.clear(); return; }
    Input.dx = Input.dy = Input.wheel = 0; Input.keys.clear();
    G.toast = 'DEMO PLAY   PRESS SPACE'; G.toastT = 0.2;
  }

  switch (G.state) {
    case 'attract':
      attractCamera();
      if (fire_) startGame();
      else if (G.stateT > 12 && !TEST) startDemo();
      break;
    case 'brief':
      if (G.demo) demoAim(rdt);
      updateAim(rdt);
      if (G.stateT > 3.2 || (fire_ && G.stateT > 0.6)) setState('aim');
      break;
    case 'aim': {
      if (G.demo) demoAim(rdt);
      updateAim(rdt);
      G.timeLeft -= rdt;
      if (G.demo && G.stateT > 1.6) { fire(); break; }
      if (fire_) { fire(); break; }
      if (G.timeLeft <= 0) {
        G.rounds--; Sfx.deny(); toast('TARGET ESCAPED', 2.5);
        if (G.rounds <= 0) { setState('gameover'); Sfx.gameOver && Sfx.gameOver(); break; }
        Target.spawn(G.stage); G.timeLeft = 60;
      }
      break;
    }
    case 'shot':
      updateAim(rdt);
      gdt = rdt * 0.5;
      if (G.stateT > 0.2) { G.staticAmt = 0.45; G.shake = 1; Sfx.staticBurst(0.12); Sfx.flightStart(); camK.init = false; setState('flight'); }
      break;
    case 'flight': {
      // steering input: mouse displaces a self-centring stick, keys push it toward the stops
      const kx = (held('ArrowRight', 'KeyD') ? 1 : 0) - (held('ArrowLeft', 'KeyA') ? 1 : 0);
      const ky = (held('ArrowUp', 'KeyW') ? 1 : 0) - (held('ArrowDown', 'KeyS') ? 1 : 0);
      G.stick.x += Input.dx * 0.011; G.stick.y -= Input.dy * 0.011;
      if (kx) G.stick.x = damp(G.stick.x, kx, 6, rdt); if (ky) G.stick.y = damp(G.stick.y, ky, 6, rdt);
      if (!kx && !Input.dx) G.stick.x = damp(G.stick.x, 0, 2.4, rdt);
      if (!ky && !Input.dy) G.stick.y = damp(G.stick.y, 0, 2.4, rdt);
      if (G.stick.length() > 1) G.stick.normalize();
      if (G.auto || G.demo) Bullet.autopilot(Target.chest, G.stick, 0.75, G.tgtVel);
      else if (window.__X && window.__X.bot) window.__X.bot(G, rdt);
      const B = Bullet.S;
      const remaining = Target.chest.distanceTo(B.p);
      const sp = Math.max(1, B.v.length());
      tmpV.subVectors(Target.chest, B.p); const along = tmpV.dot(B.v) / sp;
      G.tti = Math.max(0, along) / sp;
      // time scale: slow launch (the round leaving the barrel), cruise, then an extra slow-down in the last second
      const launch = lerp(0.1, 1, sstep(0, 0.75, G.stateT));
      const term = lerp(0.32, 1, sstep(0, G.baseTS * 1.2, G.tti));
      G.timeScale = G.baseTS * launch * term;
      if (along < -2) { if (G.passedT < 0) G.passedT = G.stateT; G.timeScale = G.baseTS * 2; }
      gdt = rdt * G.timeScale;
      let ev = Bullet.step(gdt, G.stick);
      // the round has flown past the man (or the flight is dragging on): end it as a miss, never soft-lock
      if (!ev && ((G.passedT >= 0 && G.stateT - G.passedT > 0.5) || G.stateT > 25)) ev = Bullet.abort();
      G.tgtRange = remaining;
      Sfx.flightUpdate(sp / PHYS.v0, G.timeScale, clamp(1 - remaining / 120, 0, 1));
      if (ev) { onBulletEvent(ev); gdt = rdt * 0.1; break; }
      // seeker lock announcement
      if (!G.locked && B.lock >= 1) { G.locked = true; Sfx.lock(); toast('SEEKER LOCK', 0.8); }
      nearMissCheck(rdt);
      chaseCamera(rdt);
      break;
    }
    case 'killcam': {
      // impact freeze, long slow-motion hang, then ramp back to real time
      G.timeScale = G.stateT < 0.15 ? 0.02 : lerp(0.07, 1, sstep(0.9, 3.4, G.stateT));
      gdt = rdt * G.timeScale;
      killCamera(rdt);
      if (G.demo && G.stateT > 4.2) { endDemo(); break; }
      if (G.stateT > 5.6 || (fire_ && G.stateT > 1.2)) { setState('tally'); G.tallyTick = 0; }
      break;
    }
    case 'misscam':
      G.timeScale = lerp(0.15, 1, sstep(0, 1.6, G.stateT)); gdt = rdt * G.timeScale;
      missCamera(rdt);
      if (G.demo && G.stateT > 2.4) { endDemo(); break; }
      if (G.stateT > 2.8 || (fire_ && G.stateT > 0.8)) {
        Bullet.clearTrail();
        if (G.rounds <= 0) { setState('gameover'); Sfx.gameOver && Sfx.gameOver(); } else { G.staticAmt = 0.8; Sfx.staticBurst(0.15); setState('aim'); }
      }
      break;
    case 'tally': {
      killCamera(rdt);
      const row = Math.floor((G.stateT - 0.5) / 0.45);
      if (row >= 0 && row <= G.tallyRows.length && row >= (G.tallyTick || 0)) { G.tallyTick = row + 1; if (row === G.tallyRows.length && Sfx.bonus) Sfx.bonus(); else Sfx.tick(); }
      if ((fire_ && G.stateT > 1.0) || G.stateT > 7) { G.stage++; G.staticAmt = 1; Sfx.staticBurst(0.2); newStage(); }
      break;
    }
    case 'gameover':
      aimCamera(rdt);
      if (G.stateT > 1.5 && (fire_ || G.stateT > 8)) {
        const rank = G.table.findIndex((e) => G.score > e.s);
        if (G.score > 0 && (rank >= 0 || G.table.length < 5)) { G.initials = ['A', 'A', 'A']; G.initialPos = 0; setState('initials'); }
        else setState('attract');
      }
      break;
    case 'initials': {
      aimCamera(rdt);
      const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';
      const i = A.indexOf(G.initials[G.initialPos]);
      if (pressed('ArrowUp', 'KeyW') || Input.wheel < 0) { G.initials[G.initialPos] = A[(i + 1) % A.length]; Sfx.tick(); }
      else if (pressed('ArrowDown', 'KeyS') || Input.wheel > 0) { G.initials[G.initialPos] = A[(i - 1 + A.length) % A.length]; Sfx.tick(); }
      if (pressed('ArrowLeft') && G.initialPos > 0) G.initialPos--;
      if (fire_ || pressed('ArrowRight')) {
        Sfx.blip(1200, 0.05);
        if (G.initialPos < 2) G.initialPos++;
        else if (fire_) {
          G.table.push({ n: G.initials.join(''), s: G.score }); G.table.sort((a, b) => b.s - a.s); G.table = G.table.slice(0, 5);
          Store.set('table', G.table); G.hi = G.table[0].s; setState('attract');
        }
      }
      break;
    }
  }
  // ragdoll contact sounds (rising edge of contact, throttled)
  if (Target.S.ragdoll && !Target.S.settled) {
    G.thudCool = (G.thudCool || 0) - rdt;
    if (Target.S.anyContact && !G.wasContact && G.thudCool <= 0) {
      G.thudCool = 0.12; const c = Target.centroid(tmpV2);
      Sfx.bodyThud && Sfx.bodyThud(0.7); FX.dust && FX.dust(c, 0.6);
    }
    G.wasContact = Target.S.anyContact;
    if (Target.S.hatRest && !G.hatLanded) { G.hatLanded = true; Sfx.hatLand && Sfx.hatLand(); }
  } else { G.wasContact = false; G.hatLanded = false; }
  // world simulation (slow motion aware)
  tgtPrev.copy(Target.chest);
  Target.update(gdt);
  if (gdt > 1e-5 && Target.S.alive) G.tgtVel.subVectors(Target.chest, tgtPrev).multiplyScalar(1 / gdt).clampLength(0, 8);
  else if (!Target.S.alive) G.tgtVel.set(0, 0, 0);
  City.updateTraffic(gdt);
  FX.update(gdt, camera.position);
  Bullet.updateVisual(gdt, camera);

  // HUD projections
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  project(Target.chest, G.tgtScreen);
  updatePipper(rdt);

  Input.pressed.clear(); Input.dx = Input.dy = Input.wheel = 0;
}

// Predicted-impact pipper as the player sees it: only after seeker lock, with sensor noise (metres at the
// target plane, so it is the same size at every range) and a display lag. The steering physics never use it.
const pipRaw = new THREE.Vector3(), tgtPrev = new THREE.Vector3();
G.tgtVel = new THREE.Vector3(); G.pipW = new THREE.Vector3(); G.lock = 0; G.whoosh = 0; G.nearMisses = 0;
function updatePipper(rdt) {
  const B = Bullet.S;
  G.lock = G.state === 'flight' && B.active ? B.lock : 0;
  if (G.state !== 'flight' || !B.active || B.lock < 1) { G.pipScreen.vis = false; G.pipInit = false; return; }
  Bullet.predict(Target.chest, pipRaw);
  const { r, u } = Bullet.frame();
  pipRaw.addScaledVector(r, B.pipErr.x).addScaledVector(u, B.pipErr.y);
  if (!G.pipInit) { G.pipW.copy(pipRaw); G.pipInit = true; }
  G.pipW.lerp(pipRaw, 1 - Math.exp(-rdt / Math.max(0.02, G.diff.pipLag || 0.08)));
  project(G.pipW, G.pipScreen);
}

// Near misses: the round threads past a structure within a few metres -> whoosh, camera kick, bonus
const NM_DIRS = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
function nearMissCheck(rdt) {
  G.nearCool = (G.nearCool || 0) - rdt; G.whoosh = Math.max(0, G.whoosh - rdt * 2.5);
  // skip the shooter's own rooftop and the final approach over the target's roof (that would trigger every time)
  if (G.nearCool > 0 || Bullet.S.travelled < 35 || G.tgtRange < 45) return;
  const { r, u } = Bullet.frame();
  NM_DIRS[0].copy(r); NM_DIRS[1].copy(r).negate(); NM_DIRS[2].copy(u); NM_DIRS[3].copy(u).negate();
  let dmin = 1e9;
  for (const d of NM_DIRS) if (City.raycast(Bullet.S.p, d, 4) && City.hit.id !== -2) dmin = Math.min(dmin, City.hit.t);
  if (dmin < 3.2) {
    G.nearCool = 0.6; G.whoosh = 1; G.shake = Math.max(G.shake, 0.8); G.nearMisses = Math.min(5, G.nearMisses + 1);
    if (Sfx.whoosh) Sfx.whoosh(1 - dmin / 3.2); else Sfx.staticBurst(0.06);
    toast('CLOSE CALL', 0.6);
  }
}

// ---- attract-mode demo: the autopilot plays a stage ----------------------------
function startDemo() {
  G.demoSave = { score: G.score, stage: G.stage };
  G.demo = true; G.score = G.scoreShown = 0; G.stage = 1 + Math.floor(grnd(0, 4)); G.rounds = G.maxRounds = 5;
  newStage(); G.staticAmt = 0.6;
}
function endDemo() {
  G.demo = false; G.auto = false;
  if (G.demoSave) { G.score = G.scoreShown = G.demoSave.score; G.stage = G.demoSave.stage; }
  Bullet.abort(); Bullet.hideRound(); Bullet.clearTrail(); Sfx.flightStop(); Target.hide(); FX.clear();
  G.toastT = 0; G.staticAmt = 0.6; setState('attract');
}
function demoAim(rdt) {
  const t = Target.chest; const dx = t.x - PLAYER.eye.x, dy = t.y - PLAYER.eye.y, dz = t.z - PLAYER.eye.z;
  const wy = Math.atan2(-dx, -dz), wp = Math.atan2(dy, Math.hypot(dx, dz));
  Aim.yaw = damp(Aim.yaw, wy, 2.6, rdt); Aim.pitch = damp(Aim.pitch, wp, 2.6, rdt);
  if (G.stateT > 0.8 && G.magI < 4 && Math.floor(G.stateT * 3) !== Math.floor((G.stateT - rdt) * 3)) G.magI++;
}

// ---- render -------------------------------------------------------------------
function render() {
  const scopeOn = ['brief', 'aim', 'shot', 'gameover', 'initials'].includes(G.state) ? 1 : 0;
  G.scopeAmt = scopeOn;
  const d = Post.display.uniforms, s = Post.sensor.uniforms;
  d.uMode.value = G.mode; d.uScope.value = G.scopeAmt; d.uScopeR.value = G.scopeR; d.uFlash.value = G.flash * 0.6;
  d.uStatic.value = G.staticAmt; d.uFade.value = G.fade;
  s.uPersist.value = G.state === 'flight' ? 0.08 : MODES[G.mode].persist;
  s.uNoise.value = G.mode === 2 ? 0.03 : 0.018;
  U.uCam.value.copy(camera.position);
  City.sky.position.copy(camera.position);
  const pxScale = (innerHeight * Post.pr) / (2 * Math.tan((camera.fov * DEG) / 2));
  FX.setScale(pxScale); City.setPointScale(pxScale);
  Hud.draw(G);
  Post.render(scene, camera, Hud.tex);
}

function onResize() {
  Post.resize(innerWidth, innerHeight);
  Hud.resize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ---- boot -------------------------------------------------------------------
City.generate(newSeed());
Target.spawn(1); Target.hide();
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  tick(rdt); render(); Post.adapt(rdt);
}
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('20px "Press Start 2P"'), document.fonts.load('20px "VT323"')]).catch(() => {}) : Promise.resolve();
if (!TEST) fontsReady.then(() => requestAnimationFrame(loop));

// ---- test / debug hooks --------------------------------------------------------
window.__X = {
  G, Aim, City, Target, Bullet, Post, Hud, FX, Sfx, scene, renderer, camera, fontsReady,
  advance(sec, step = 1 / 60, draw = true) { const n = Math.max(1, Math.round(sec / step)); for (let i = 0; i < n; i++) tick(step); if (draw) render(); },
  key(code) { Input.pressed.add(code); },
  start() { startGame(); },
  aimAtTarget(lead = 0) {
    const t = Target.chest; const dx = t.x - PLAYER.eye.x, dy = t.y - PLAYER.eye.y, dz = t.z - PLAYER.eye.z;
    Aim.yaw = Math.atan2(-dx, -dz) + lead; Aim.pitch = Math.atan2(dy, Math.hypot(dx, dz));
  },
  setMag(i) { G.magI = i; G.mag = MAGS[i]; },
  fire() { fire(); },
  // headless simulation without rendering (difficulty probes)
  sim(sec, step = 1 / 60) { const n = Math.max(1, Math.round(sec / step)); for (let i = 0; i < n; i++) tick(step); },
  startAt(stage) { G.score = 0; G.rounds = G.maxRounds = 5; G.stage = stage; newStage(); setState('aim'); },
  demo() { startDemo(); }, endDemo() { endDemo(); }, difficulty,
  bot: null,
  setState, setMode(m) { G.mode = m; G.modeName = MODES[m].name; },
};

</script>
